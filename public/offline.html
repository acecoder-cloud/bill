<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Offline · Pharmacy Bill Log</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #0f172a; }
    .card { max-width: 22rem; margin: 1.25rem; padding: 1.5rem; background: #fff; border-radius: 1rem;
      text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 1.25rem; margin: .75rem 0 .5rem; }
    p { color: #475569; line-height: 1.5; }
    button { margin-top: 1rem; min-height: 48px; width: 100%; border: 0; border-radius: .75rem;
      background: #0f766e; color: #fff; font-size: 1rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Pharmacy Bill Log needs an internet connection to scan and save bills. Check your Wi-Fi or mobile data.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
