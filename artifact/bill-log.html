<title>Pharmacy Bill Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one column phone app — header, scrolling content, fixed bottom tabs; tables scroll sideways inside their own box. */
:root {
  --bg: #eef3f2;
  --surface: #ffffff;
  --surface-2: #f5f8f7;
  --line: #d5e0de;
  --fg: #11231f;
  --muted: #5b6f6a;
  --brand: #0f6e66;
  --brand-ink: #ffffff;
  --brand-soft: #d9efec;
  --warn-bg: #fff4d6;
  --warn-line: #e9b949;
  --warn-ink: #7a4d00;
  --bad-bg: #fde8e7;
  --bad-line: #e5847d;
  --bad-ink: #9b1c14;
  --ok-bg: #e2f5ea;
  --ok-ink: #18603a;
  --font-ui: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1614; --surface: #15211e; --surface-2: #1b2a26; --line: #2b3d38; --fg: #e4efec; --muted: #9db1ab;
    --brand: #3fb9ab; --brand-ink: #062320; --brand-soft: #173a35;
    --warn-bg: #3a2d0c; --warn-line: #a17a1c; --warn-ink: #f6d58a;
    --bad-bg: #3d1614; --bad-line: #a3433c; --bad-ink: #ffb4ad;
    --ok-bg: #12301f; --ok-ink: #8fdcaf;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1614; --surface: #15211e; --surface-2: #1b2a26; --line: #2b3d38; --fg: #e4efec; --muted: #9db1ab;
  --brand: #3fb9ab; --brand-ink: #062320; --brand-soft: #173a35;
  --warn-bg: #3a2d0c; --warn-line: #a17a1c; --warn-ink: #f6d58a;
  --bad-bg: #3d1614; --bad-line: #a3433c; --bad-ink: #ffb4ad;
  --ok-bg: #12301f; --ok-ink: #8fdcaf;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--brand); }
button, input, select { font: inherit; color: inherit; }
input, select { font-size: max(1rem, 16px); }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--brand); color: var(--brand-ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in { max-width: 860px; margin: 0 auto; height: 56px; display: flex; align-items: center; gap: 10px; }
.mark { width: 32px; height: 32px; flex: none; }
.brand { font-weight: 800; font-size: 1.12rem; letter-spacing: -0.01em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who { display: flex; align-items: center; gap: 8px; font-size: .9rem; min-width: 0; }
.who img { width: 28px; height: 28px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--brand-ink) 40%, transparent); }
.who span { max-width: 9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.role-chip { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 99px; background: color-mix(in srgb, var(--brand-ink) 18%, transparent); }

/* Page */
main {
  max-width: 860px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
h1 { font-size: 1.45rem; line-height: 1.2; margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
h2 { font-size: 1.05rem; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* Buttons */
.btn {
  min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent; font-weight: 700; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
}
.btn-primary { background: var(--brand); color: var(--brand-ink); }
.btn-primary:active { filter: brightness(.92); }
.btn-ghost { background: var(--surface); border-color: var(--line); color: var(--fg); }
.btn-ghost:active { background: var(--surface-2); }
.btn-danger { background: transparent; border-color: var(--bad-line); color: var(--bad-ink); }
.btn-link { background: none; border: 0; color: var(--brand); font-weight: 700; min-height: 44px; padding: 0 6px; cursor: pointer; }
.btn[disabled] { opacity: .55; cursor: default; }
.btn-block { width: 100%; }

/* Scan hero */
.scan {
  min-height: 104px; width: 100%; border: 0; border-radius: 18px; cursor: pointer;
  background: var(--brand); color: var(--brand-ink); font-size: 1.6rem; font-weight: 800; letter-spacing: -0.01em;
  display: flex; align-items: center; justify-content: center; gap: 14px;
  box-shadow: 0 6px 18px color-mix(in srgb, var(--brand) 30%, transparent);
}
.scan svg { width: 40px; height: 40px; }
.sheet { display: flex; flex-direction: column; gap: 8px; margin-top: -6px; padding: 8px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 8px 24px rgb(0 0 0 / .08); }
.sheet-opt { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 12px; border: 0; border-radius: 12px; background: var(--surface-2); color: var(--fg); text-align: left; cursor: pointer; }
.sheet-opt:active { background: var(--brand-soft); }
.sheet-opt svg { width: 28px; height: 28px; color: var(--brand); flex: none; }
.sheet-opt span { display: flex; flex-direction: column; }
.sheet-opt small { color: var(--muted); font-size: .85rem; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.duo .btn { min-height: 56px; }

/* Notices */
.note { border-radius: 12px; padding: 11px 13px; border: 1px solid var(--line); background: var(--surface-2); }
.note.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
.note.bad { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad-ink); }
.note.ok { background: var(--ok-bg); border-color: transparent; color: var(--ok-ink); }

/* Bill list */
.bills { display: flex; flex-direction: column; gap: 10px; }
.bill-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.bill-wrap .bill { border: 0; border-radius: 0; }
.bill-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px 10px; border-top: 1px dashed var(--line); }
.bill-actions .btn-paid, .bill-actions .pay-note { margin-left: auto; }
.btn-sm { min-height: 44px; padding: 0 16px; }
.bill-confirm { margin: 0 12px 12px; }
.btn-paid { min-height: 44px; padding: 0 22px; background: var(--ok-bg); color: var(--ok-ink); border: 1px solid color-mix(in srgb, var(--ok-ink) 35%, transparent); }
.pill.paid { background: var(--ok-bg); color: var(--ok-ink); }
.pill.unpaid { background: var(--bad-bg); color: var(--bad-ink); }
.bill {
  text-align: left; width: 100%; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 13px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; color: var(--fg);
}
.bill:active { background: var(--surface-2); }
.bill .d { font-weight: 700; font-size: 1.05rem; }
.billno-tag { font-size: .8rem; font-weight: 600; color: var(--muted); margin-left: 4px; }
.bill .t { font-weight: 600; font-size: 1.05rem; text-align: right; }
.bill .m { color: var(--muted); font-size: .85rem; grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); }

/* Filters */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { min-height: 40px; border: 0; border-radius: 9px; background: transparent; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--brand); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: .82rem; font-weight: 600; color: var(--muted); }
.inp { min-height: 46px; width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 11px; }
.inp:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.inp[disabled] { background: var(--surface-2); }
.dates { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Totals band */
.total-band { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 16px; border-radius: var(--r); background: var(--brand); color: var(--brand-ink); }
.total-band b { font-size: 1.35rem; }

/* Tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { padding: 9px 11px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
td.wrap { white-space: normal; min-width: 12rem; }
th { background: var(--surface-2); font-size: .8rem; color: var(--muted); }
th button { all: unset; cursor: pointer; font-weight: 700; display: inline-flex; gap: 4px; align-items: center; min-height: 36px; }
th button[aria-sort="ascending"], th button[aria-sort="descending"] { color: var(--brand); }
.r { text-align: right; }
tr.mm td { background: var(--warn-bg); }
tfoot td { font-weight: 800; background: var(--surface-2); border-bottom: 0; }
.link { background: none; border: 0; color: var(--brand); font-weight: 700; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }

/* Editor */
.card.ed-top { flex-direction: row; gap: 12px; align-items: flex-end; }
.pay-row { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding-block: 10px; }
.pay-row .field-lbl { font-size: .82rem; font-weight: 600; color: var(--muted); }
.pay-row .seg { flex: 1; min-width: 200px; }
.pay-row .seg button[data-v="paid"][aria-pressed="true"] { color: var(--ok-ink); background: var(--ok-bg); }
.pay-row .small { flex-basis: 100%; }
.ed-fields { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 10px; }
.ed-top .billno { min-height: 52px; font-size: 1.1rem; font-weight: 700; font-family: var(--font-num); }
@media (max-width: 420px) { .ed-fields { grid-template-columns: 1fr; } }
.ed-top .date { min-height: 52px; font-size: 1.1rem; font-weight: 700; }
.thumb { width: 64px; height: 64px; flex: none; border-radius: 12px; border: 1px solid var(--line); overflow: hidden; padding: 0; background: var(--surface-2); cursor: pointer; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rows { display: flex; flex-direction: column; gap: 10px; }
.irow { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 11px; display: flex; flex-direction: column; gap: 8px; }
.irow.is-mm { border: 2px solid var(--warn-line); background: color-mix(in srgb, var(--warn-bg) 45%, var(--surface)); }
.irow.is-bad { border: 2px solid var(--bad-line); }
.irow-top { display: flex; align-items: center; gap: 8px; }
.irow-label { font-size: .82rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.sno { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); }
.sno .inp { width: 64px; text-align: center; }
.del { width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--bad-ink); cursor: pointer; display: grid; place-items: center; }
.del svg { width: 20px; height: 20px; }
.nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.nums .inp { text-align: right; font-family: var(--font-num); }
.nums .inp.is-mm { border-color: var(--warn-line); background: var(--warn-bg); }
.mm-hint { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--warn-ink); font-size: .9rem; }
.mm-hint[hidden] { display: none; }
.rows-head { display: none; }
@media (min-width: 680px) {
  .rows { gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
  .rows-head, .irow { display: grid; grid-template-columns: 76px minmax(0, 1fr) 92px 104px 118px 48px; gap: 8px; align-items: center; }
  .rows-head { padding: 8px 11px; background: var(--surface-2); font-size: .8rem; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-bottom: 0; border-radius: var(--r) var(--r) 0 0; }
  .rows-head { margin-bottom: -16px; }
  .rows-head + .rows { border-radius: 0 0 var(--r) var(--r); }
  .irow { border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 7px 11px; }
  .irow:first-child { border-top: 0; }
  .irow.is-mm { border: 0; border-top: 1px solid var(--line); background: var(--warn-bg); }
  .irow.is-bad { border: 0; border-top: 1px solid var(--line); background: var(--bad-bg); }
  .irow-top, .nums { display: contents; }
  .irow-label, .nums .lbl, .sno .lbl { display: none; }
  .sno { order: 1; margin: 0; }
  .sno .inp { width: 100%; }
  .irow > .name { order: 2; }
  .nums label:nth-child(1) { order: 3; }
  .nums label:nth-child(2) { order: 4; }
  .nums label:nth-child(3) { order: 5; }
  .del { order: 6; }
  .mm-hint { order: 7; grid-column: 2 / -1; }
}
.foot {
  position: sticky; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); z-index: 10;
  background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; align-items: center; gap: 12px;
  box-shadow: 0 4px 16px rgb(0 0 0 / .08);
}
.foot .sum { flex: 1; min-width: 0; }
.foot .sum b { font-size: 1.3rem; display: block; }
.foot .btn { min-width: 140px; font-size: 1.05rem; }

/* Steps */
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.steps li { display: flex; align-items: center; gap: 12px; font-size: 1.05rem; }
.steps li.todo { color: var(--muted); }
.dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; font-size: .8rem; font-weight: 800; }
.done .dot { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--brand-soft); border-top-color: var(--brand); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.preview { max-height: 220px; width: auto; max-width: 100%; margin: 0 auto; border-radius: 12px; display: block; }

/* Report column picks */
.picks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pick { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; font-weight: 600; font-size: .92rem; }
.pick:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.pick input { width: 20px; height: 20px; accent-color: var(--brand); }

/* People */
.people { display: flex; flex-direction: column; }
.person { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.person:first-child { border-top: 0; }
.person img { width: 36px; height: 36px; border-radius: 50%; }
.person .grow { flex: 1; min-width: 0; }
.add-panel { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.add-panel .person { border-top-color: var(--line); }
.member { flex-wrap: wrap; }
.member-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
@media (max-width: 520px) { .member-actions { flex-basis: 100%; padding-left: 48px; justify-content: space-between; } .member-actions .role-sel { flex: 1; max-width: 220px; } }
.role-sel { min-height: 44px; width: auto; padding-right: 28px; }
.confirm-slot { flex-basis: 100%; }
.cand { flex-wrap: wrap; }
.label-row { flex-basis: 100%; display: flex; flex-direction: column; gap: 4px; padding-left: 48px; }
.label-row[hidden] { display: none; }
.confirm-slot:empty { display: none; }
.danger-text { color: var(--bad-ink); }
.ok-text { color: var(--ok-ink); font-weight: 600; }
.invite { display: flex; flex-direction: column; gap: 6px; border-top: 1px dashed var(--line); padding-top: 10px; }
.copy-row { display: flex; gap: 8px; }
.copy-row .inp { flex: 1; font-size: .8rem; }
details.small ul { margin: 6px 0; padding-left: 18px; }
.perm-table td.c, .perm-table th.c { text-align: center; width: 76px; }
.perm-table tr.grp td { background: var(--surface-2); font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-block: 6px; }
.perm-table td.wrap { min-width: 11rem; }
.perm-box { width: 22px; height: 22px; accent-color: var(--brand); }
.editor-pill { background: var(--warn-bg); color: var(--warn-ink); }
/* Inventory */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: .88rem; cursor: pointer; color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.inv-list { display: grid; gap: 8px; }
@media (min-width: 680px) { .inv-list { grid-template-columns: 1fr 1fr; } }
.inv-card { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: start; text-align: left; width: 100%; padding: 11px 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.inv-card[aria-expanded="true"] { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
.inv-card.is-low { border-left: 5px solid var(--warn-line); background: color-mix(in srgb, var(--warn-bg) 55%, var(--surface)); }
.inv-card.is-stopped { opacity: .55; }
.inv-sno { color: var(--muted); font-size: .85rem; padding-top: 2px; }
.inv-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.inv-main b { overflow-wrap: anywhere; }
.inv-pills { display: flex; flex-wrap: wrap; gap: 4px; }
.inv-stock { font-size: 1.35rem; font-weight: 600; text-align: right; line-height: 1.1; }
.inv-stock small { display: block; font-size: .7rem; color: var(--muted); font-family: var(--font-ui); }
.pill.low { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-line); }
.pill.stop { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: .92rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.hist { display: flex; flex-wrap: wrap; gap: 6px; }
.hist span { display: inline-flex; flex-direction: column; align-items: center; min-width: 40px; padding: 4px 6px; border-radius: 8px; background: var(--surface-2); font-size: .9rem; }
.hist small { font-size: .65rem; color: var(--muted); font-family: var(--font-ui); }
.inv-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.reg-head .reg-title { display: flex; flex-direction: column; align-items: center; text-align: center; flex: 1; }
.reg-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.reg-tools .field { flex: 1 1 140px; }
.reg-wrap { overflow: auto; max-height: 68vh; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }

function isPdf(file) { return file.type === "application/pdf" || /\.pdf$/i.test(file.name || ""); }
/** Turns the first pages of a PDF bill into JPEG images Claude can read. */
async function pdfToImages(file, maxPages) {
  await loadScript(PDFJS + "pdf.min.js");
  const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js";
  let pdf;
  try { pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise; }
  catch (e) { throw new Error(e?.name === "PasswordException" ? "That PDF is password-protected." : "That PDF couldn't be opened."); }
  const out = [];
  for (let i = 1; i <= Math.min(pdf.numPages, maxPages); i++) {
    const page = await pdf.getPage(i);
    const base = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: Math.min(2.5, 1600 / base.width) });
    const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    out.push(await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85)));
  }

const EXTRACT_PROMPT = `You are reading a photo of a pharmacy bill (invoice / cash memo), usually from India.
Extract every purchased line item, top to bottom, exactly as printed:
- serial_no: the S.No./Sr. printed on the line (null if none).
- item_name: the product name as printed, with strength/pack (e.g. "Dolo 650 Tab 15's"). Leave out batch no., expiry, HSN and MRP.
- qty: quantity billed (number). rate: per-unit rate charged (number, no symbols or commas). total_amount: that line's amount (number).
- bill_no: the bill / invoice / cash memo number exactly as printed (e.g. "4471" or "CM/2026/0193"). null if not visible.
- bill_date: the bill date as YYYY-MM-DD. Indian bills write dates day-first (03/11/26 = 2026-11-03). null if not visible.
Copy numbers exactly as printed; do not fix totals to match qty × rate. Use null for anything you cannot read with confidence.
Skip subtotal, discount, GST/tax summary, round-off and grand-total lines. If the image is not a bill, set is_bill to false and return no items.

function normalizeExtraction(raw) {

    item_name: typeof r.item_name === "string" ? r.item_name.trim() : "",
    qty: parseNum(r.qty), rate: parseNum(r.rate), total_amount: parseNum(r.total_amount),
  })).filter((r) => r.item_name || r.qty != null || r.rate != null || r.total_amount != null);
  const billNo = typeof o.bill_no === "string" || typeof o.bill_no === "number" ? String(o.bill_no).trim().slice(0, 60) : "";

async function processFile(file) {
  const ed = S.editor; if (!ed) return;
  const pdf = isPdf(file);
  if (!pdf) ed.previewUrl = URL.createObjectURL(file);
  const step = (s) => { if (S.editor === ed) { ed.step = s; renderEditor(); } };
  let blob, images, pdfNote = "";
  try {
    step("compress");
    if (pdf) {
      const lim = await S.caps.sample?.limits().catch(() => null);
      const r = await pdfToImages(file, Math.max(1, Math.min(lim?.images?.maxCount || 3, 5)));
      if (!r.images.length) throw new Error("That PDF has no pages.");
      images = r.images; blob = images[0]; ed.previewUrl = URL.createObjectURL(blob);
      if (r.pages > images.length) pdfNote = ` Only the first ${images.length} of ${r.pages} pages were read.`;
    } else { blob = await compressImage(file); images = [blob]; }
  }
  catch (e) { return finishExtract(ed, null, { tone: "warn", text: (e.message || "The bill couldn't be prepared.") + " Enter the items below." }); }
  step("read");
  const upload = S.caps.assets ? S.caps.assets.upload(blob, { type: "image/jpeg" }).then((r) => r.id) : Promise.resolve(null);
  const read = (async () => {
    const sample = S.caps.sample; if (!sample) throw { message: "Reading photos with Claude isn't available in this view." };
    const lim = await sample.limits().catch(() => null);
    if (!lim?.images) throw { code: "images_unavailable" };
    return normalizeExtraction(await sample.json(EXTRACT_PROMPT + (images.length > 1 ? `\nThe ${images.length} images are consecutive pages of one bill, in order.` : ""), { images }));
  })();
  const [up, rd] = await Promise.allSettled([upload, read]);
  if (S.editor !== ed) return;
  ed.imageId = up.status === "fulfilled" ? up.value : null;
  const photoNote = up.status === "rejected" ? " The photo couldn't be saved with the bill." : !S.caps.assets ? " Photos aren't saved with bills for your access level." : "";
  if (rd.status === "rejected") return finishExtract(ed, null, { tone: "warn", text: `${sampleErrorText(rd.reason)} Enter the items below.${photoNote}` });
  const x = rd.value;
  if (!x.is_bill) return finishExtract(ed, null, { tone: "warn", text: `This photo doesn't look like a bill. Retake it or enter the items below.${photoNote}` });
  if (!x.items.length) return finishExtract(ed, null, { tone: "warn", text: `No items could be read from this photo. Enter them below.${photoNote}` });
  finishExtract(ed, x, { tone: x.bill_date && !pdfNote ? "ok" : "warn", text: (x.bill_date ? `Read ${x.items.length} item${x.items.length === 1 ? "" : "s"}. Check every value against the bill before submitting.` : `Read ${x.items.length} item${x.items.length === 1 ? "" : "s"}, but no date was found. Set the bill date.`) + pdfNote + photoNote });
}

/* ---------------- photo viewer (pinch to zoom) ---------------- */
function openViewer(src) {
  const v = document.createElement("div"); v.className = "viewer"; v.setAttribute("role", "dialog"); v.setAttribute("aria-label", "Bill photo");
  v.innerHTML = `<div class="viewer-bar"><span class="small">Pinch or double-tap to zoom</span><button data-x>Close</button></div><div class="stage"><img alt="Bill photo"></div>`;
  const img = v.querySelector("img"); img.src = src; document.body.append(v); document.body.style.overflow = "hidden";
  let s = 1, tx = 0, ty = 0; const pts = new Map(); let last = null, lastTap = 0;
  const apply = () => { img.style.transform = `translate(${tx}px,${ty}px) scale(${s})`; };
  const stage = v.querySelector(".stage");
  const local = (e) => { const r = img.getBoundingClientRect(); return { x: e.clientX - r.left + 0, y: e.clientY - r.top + 0 }; };
  const zoomAt = (cx, cy, ns) => { ns = Math.min(6, Math.max(1, ns)); const r = stage.getBoundingClientRect(); const ox = cx - r.left, oy = cy - r.top; const base = img.offsetLeft, baseT = img.offsetTop; const px = (ox - base - tx) / s, py = (oy - baseT - ty) / s; s = ns; tx = ox - base - px * s; ty = oy - baseT - py * s; if (s === 1) { tx = 0; ty = 0; } apply(); };
  stage.addEventListener("pointerdown", (e) => { stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, e); if (pts.size === 1) { const now = Date.now(); if (now - lastTap < 300) zoomAt(e.clientX, e.clientY, s > 1 ? 1 : 2.5); lastTap = now; } last = null; });
  stage.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return; const prev = pts.get(e.pointerId); pts.set(e.pointerId, e);
    if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); const cx = (a.clientX + b.clientX) / 2, cy = (a.clientY + b.clientY) / 2; if (last) zoomAt(cx, cy, s * d / last); last = d; }
    else if (s > 1) { tx += e.clientX - prev.clientX; ty += e.clientY - prev.clientY; apply(); }
  });
  const up = (e) => { pts.delete(e.pointerId); last = null; };
  stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
  stage.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, s * (e.deltaY < 0 ? 1.15 : 0.87)); }, { passive: false });
  const close = () => { v.remove(); document.body.style.overflow = ""; document.removeEventListener("keydown", key); };
  const key = (e) => e.key === "Escape" && close();
  document.addEventListener("keydown", key);
  v.querySelector("[data-x]").onclick = close;
  v.querySelector("[data-x]").focus();
}

});

const clone = (o) => (o == null ? o : JSON.parse(JSON.stringify(o)));
function isObj(v) { return v && typeof v === "object" && !Array.isArray(v); }
function deepMerge(target, src) {
  for (const [k, v] of Object.entries(src)) { if (isObj(v) && isObj(target[k])) deepMerge(target[k], v); else target[k] = isObj(v) ? clone(v) : v; }
  return target;
}
function normName(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
function monthKey(iso) { return iso.slice(0, 7); }
function daysIn(mk) { const [y, m] = mk.split("-").map(Number); return new Date(y, m, 0).getDate(); }
function monthLabel(mk) { const [y, m] = mk.split("-").map(Number); return `${MONTH_NAMES[m - 1]} ${y}`; }
function addMonths(mk, n) { const [y, m] = mk.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }

/* ---------- loading ---------- */

  }, () => { INV.loaded.products = true; invChanged(); });

/* ---------- stock maths ---------- */

/* ---------- seed (first run or "Load November 2026 register"; adds only what's missing) ---------- */
function parseCsv(text) {

      if (!lease.acquired) return;
      const fresh = await S.caps.db.doc("inventory/settings").get().catch(() => null);
      if (fresh?.exists && fresh.data().seeded_at) return;
    }
    const rows = parseCsv(SEED_CSV); const head = rows.shift().map((h) => h.trim());
    const byName = new Map([...INV.products.entries()].map(([id, p]) => [normName(p.name), id]));
    const now = new Date().toISOString(); const mk = "2026-11";
    const counts = {}; const flags = {}; let added = 0;

      const o = Object.fromEntries(head.map((h, i) => [h, (r[i] ?? "").trim()]));
      let pid = byName.get(normName(o.name));

      const s = Number(r[ix.sno]); const op = num(r, ix.open, "Opening stock", line);

function openForm(pid) {

async function submitForm() {
  const f = INV.form; const v = f.values;
  const name = v.name.trim(); const err = (m) => { f.err = m; $("#pf-err").innerHTML = `<div class="note bad">${esc(m)}</div>`; };
  if (!name) return err("Enter the product name.");
  const category = f.newCat ? (v.newcat || "").trim() : v.category;
  if (f.newCat && !category) return err("Type the new category name, or pick an existing one.");
  const unit = (f.otherUnit || (v.unit && !UNITS.includes(v.unit))) ? (v.otherunit ?? v.unit ?? "").trim() : v.unit;
  const nums = {}; for (const [k, label] of [["min", "Minimum level"], ["use", "Monthly use"], ["open", "Opening stock"]]) { const n = parseCount(v[k]); if (Number.isNaN(n) || n < 0) return err(`${label} must be a number like 5, 0.5 or 1/2.`); nums[k] = n; }
  f.saving = true; render();
  const now = new Date().toISOString();
  try {
    if (f.mode === "add") {
      const pid = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const doc = { sno: nextSno(), name, category, unit, min_level: nums.min, monthly_use: nums.use, opening_stock: nums.open, expected_delivery: v.due || null, batch: v.batch.trim(), notes: v.notes.trim(), status: v.status, archived: false, created_at: now, created_by: S.uid, updated_at: now };
      const r = await invWrite("set", `${INV_PRODUCTS}/${pid}`, doc);
      if (nums.open != null) {
        const cur = monthKey(invTodayISO()); const mk = INV.months.has(cur) ? cur : latestMonths(1)[0];
        if (mk && INV.months.has(mk)) await invWrite("update", `${INV_MONTHS}/${mk}`, { counts: { [pid]: { [mk === cur ? Number(invTodayISO().slice(8, 10)) : 1]: nums.open } } });
      }
      if (category && !categories().includes(category)) await invWrite(Object.keys(INV.settings).length ? "update" : "set", "inventory/settings", { categories: [...new Set([...(INV.settings.categories || []), category])] });
      writeAudit("inventory.add", null, pid, null, doc);
      flash(`${name} added as S.No ${doc.sno}.${r === "queued" ? " Saved on this phone until you're back online." : ""}`);
      INV.detail = pid;
    } else {
      const before = INV.products.get(f.pid);
      const changes = { name, category, unit, min_level: nums.min, monthly_use: nums.use, expected_delivery: v.due || null, expiry: null, batch: v.batch.trim(), notes: v.notes.trim(), status: v.status, updated_at: now, updated_by: S.uid };
      await invWrite("update", `${INV_PRODUCTS}/${f.pid}`, changes);
      writeAudit("inventory.edit", null, f.pid, before, { ...before, ...changes });
      flash(`${name} saved.`); INV.detail = f.pid;
    }
    INV.form = null; INV.view = "list";
  } catch (e) { f.saving = false; f.err = dbErrorText(e).replace("save this bill", "save this product"); }
  render(); window.scrollTo(0, 0);
}

/* ---------- optional link to billing ---------- */
async function invAfterBill(items) {
  if (!INV.settings.bill_link || !canInvCount()) return 0;
  const mk = monthKey(invTodayISO()); if (!INV.months.has(mk)) return 0;
  const day = Number(invTodayISO().slice(8, 10)); const byName = new Map(sortedProducts().map(([pid, p]) => [normName(p.name), pid]));
  const counts = {}; let n = 0;
  for (const it of items) {
    const pid = byName.get(normName(it.item_name)); if (!pid || !(it.qty > 0)) continue;
    const base = counts[pid]?.[day] ?? currentStock(pid)?.value; if (base == null) continue;
    counts[pid] = { [day]: Math.max(0, Number((base - it.qty).toFixed(3))) }; n++;
  }
  if (n) await invWrite("update", `${INV_MONTHS}/${mk}`, { counts }).catch(() => {});
  return n;
}

/* ---------- formatting & keys ---------- */
const inrFmt = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 });
const inr = (n) => (n < 0 ? "−" : "") + "₹" + inrFmt.format(Math.abs(Math.round(n || 0)));
const grouped = (n) => (n < 0 ? "-" : "") + inrFmt.format(Math.abs(Math.round(n || 0)));
const signedInr = (n) => (n > 0 ? "+" : "") + inr(n);
const dmy = (iso) => (iso ? iso.split("-").reverse().join("/") : "");
const shortDm = (iso) => dmy(iso).slice(0, 5);
/** "Idly", "Idliy", "IDLI" and "Idli" all give the same key. */
function fuzzyKey(s) { return String(s || "").toLowerCase().replace(/[^a-z]/g, "").replace(/y/g, "i").replace(/(.)\1+/g, "$1"); }
function parseRupees(v) { const s = String(v ?? "").replace(/[₹,\s]/g, ""); if (!s) return null; if (!/^\d+$/.test(s)) return NaN; return Number(s); }
function accTodayISO() { return todayISO(); }
function addDays(iso, n) { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function needsReviewNote(note) { const n = String(note || ""); return /^date written as/i.test(n) || /possible duplicate/i.test(n) || /^no item name/i.test(n); }

function accStart() {

  db.collection(ACC_TX).onSnapshot((snap) => { ACC.tx = new Map(snap.docs.map((d) => [d.id, clone(d.data())])); reapplyOutbox(ACC_TX); if (!snap.metadata.fromCache) ACC.loaded.tx = true; accChanged(); accMaybeSeed(); }, () => { ACC.loaded.tx = true; accChanged(); });
  db.collection(ACC_CHECKS).onSnapshot((snap) => { ACC.checks = new Map(snap.docs.map((d) => [d.id, clone(d.data())])); reapplyOutbox(ACC_CHECKS); accChanged(); }, () => {});

}
let accQueued = false;
function accChanged() {
  if (accQueued) return; accQueued = true;
  requestAnimationFrame(() => { accQueued = false; renderTabs(); if (S.tab === "accounts" && !S.editor && !accBusy()) render(); });
}
function accBusy() { return !!(ACC.form || ACC.itemForm || ACC.importPreview || ACC.confirm || document.activeElement?.closest?.(".acc-filters, #acc-check")); }
function accRefresh() { if (S.tab === "accounts" && !S.editor) render(); else renderTabs(); }
function accWrite(op, path, data) { return invWrite(op, path, data); }   // same instant-on-screen + offline queue as Inventory

/* ---------- balances (always calculated, never typed) ---------- */
function txList() { return [...ACC.tx.entries()].map(([id, t]) => ({ id, ...t })).sort((a, b) => a.date.localeCompare(b.date) || (a.seq || 0) - (b.seq || 0)); }
const signed = (t) => (t.type === "received" ? t.amount : -t.amount);
function balanceThrough(iso) { let b = 0; for (const t of ACC.tx.values()) if (t.date <= iso) b += signed(t); return b; }
function balanceBefore(iso) { let b = 0; for (const t of ACC.tx.values()) if (t.date < iso) b += signed(t); return b; }
function totalsBetween(from, to) {
  let received = 0, spent = 0, nRec = 0; const cats = {};
  for (const t of ACC.tx.values()) {
    if ((from && t.date < from) || (to && t.date > to)) continue;
    if (t.type === "received") { received += t.amount; nRec++; }
    else { spent += t.amount; for (const l of t.lines || []) cats[l.category || "Other"] = (cats[l.category || "Other"] || 0) + l.amount; }
  }
  const opening = from ? balanceBefore(from) : 0;
  return { received, spent, nRec, cats, opening, closing: opening + received - spent };
}
function availableNow() { let b = 0; for (const t of ACC.tx.values()) b += signed(t); return b; }

/* ---------- periods ---------- */
function periodMode() { return ["10", "14", "month"].includes(ACC.settings.period) ? ACC.settings.period : "10"; }
function monthEnd(iso) { const [y, m] = iso.split("-").map(Number); return `${y}-${String(m).padStart(2, "0")}-${String(new Date(y, m, 0).getDate()).padStart(2, "0")}`; }
function periodOf(iso) {
  const mode = periodMode(); const [y, m, d] = iso.split("-").map(Number); const ym = `${y}-${String(m).padStart(2, "0")}`;
  if (mode === "month") return { start: `${ym}-01`, end: monthEnd(iso) };
  if (mode === "14") {
    const anchor = ACC.settings.anchor || txList()[0]?.date || iso;
    const days = Math.floor((new Date(iso + "T00:00:00") - new Date(anchor + "T00:00:00")) / 864e5);
    const start = addDays(anchor, Math.floor(days / 14) * 14); return { start, end: addDays(start, 13) };
  }
  if (d <= 10) return { start: `${ym}-01`, end: `${ym}-10` };
  if (d <= 20) return { start: `${ym}-11`, end: `${ym}-20` };
  return { start: `${ym}-21`, end: monthEnd(iso) };
}
function periodsList() {
  const first = txList()[0]?.date; if (!first) return [];
  const out = []; let p = periodOf(first); const today = accTodayISO(); const lastDate = txList().at(-1).date; const stop = lastDate > today ? lastDate : today;
  for (let i = 0; i < 400 && p.start <= stop; i++) { out.push({ ...p, ...totalsBetween(p.start, p.end) }); p = periodOf(addDays(p.end, 1)); }
  return out;
}
function periodLabel(p) { return `${dmy(p.start)} – ${dmy(p.end)}`; }
function rangeBounds() {
  const today = accTodayISO();
  if (ACC.range === "period") return periodOf(today);
  if (ACC.range === "month") return { start: today.slice(0, 8) + "01", end: monthEnd(today) };
  if (ACC.range === "custom") return { start: ACC.from || "", end: ACC.to || "" };
  return { start: "", end: "" };
}

/* ---------- WhatsApp message (agreed format) ---------- */
function lineText(t) {
  if (t.type === "received") return `*${dmy(t.date)} Amount received ${grouped(t.amount)}*`;
  const name = (t.lines || []).map((l) => (l.qty > 1 ? `${l.name} x${l.qty}` : l.name)).join(" & ") || "Expense";
  return `${dmy(t.date)} - ${name} ${t.amount} rupees`;
}
/** Top and bottom lines both show the period's closing balance, calculated from every entry up to its last day. */
function whatsappText(p) {
  const entries = txList().filter((t) => t.date >= p.start && t.date <= p.end);
  const bal = grouped(balanceThrough(p.end));
  return [`*Available -RS: ${bal}*`, "", ...entries.map(lineText), "", `*RS: ${bal}*`].join("\n");
}

/* ---------- items ---------- */
function activeItems() { return [...ACC.items.entries()].filter(([, i]) => !i.archived).sort((a, b) => a[1].name.localeCompare(b[1].name)); }
function itemByName(name) { const k = fuzzyKey(name); if (!k) return null; for (const [id, i] of ACC.items) if (!i.archived && fuzzyKey(i.name) === k) return [id, i]; return null; }
function itemStats() {
  const st = new Map(); for (const id of ACC.items.keys()) st.set(id, { used: 0, last: null });
  const byKey = new Map([...ACC.items.entries()].map(([id, i]) => [fuzzyKey(i.name), id]));
  for (const t of ACC.tx.values()) if (t.type === "expense") for (const l of t.lines || []) {
    const id = l.item_id && st.has(l.item_id) ? l.item_id : byKey.get(fuzzyKey(l.name)); if (!id) continue;
    const s = st.get(id); s.used++; if (!s.last || t.date > s.last) s.last = t.date;
  }
  return st;
}
function accCategories() {
  return [...new Set([...ACC_BASE_CATS, ...(ACC.settings.categories || []), ...[...ACC.items.values()].map((i) => i.category).filter(Boolean)])];
}

/* ---------- seed: WhatsApp ledger Aug–Nov 2026 (first run or button; never overwrites) ---------- */
async function accSeed(auto) {
  if (ACC.seeding || !canAccManage()) return;
  if (ACC.settings.seeded_at) { flash("The WhatsApp ledger was already imported."); accRefresh(); return; }
  ACC.seeding = { done: 0, total: 0 }; accRefresh();
  try {
    if (auto) {
      const lease = await S.caps.db.doc(ACC_SETTINGS).acquire({ holder: S.uid, ttlMs: 120000 }).catch(() => ({ acquired: true }));
      if (!lease.acquired) return;
      const fresh = await S.caps.db.doc(ACC_SETTINGS).get().catch(() => null);
      if (fresh?.exists && fresh.data().seeded_at) return;
    }
    const now = new Date().toISOString();
    const itemRows = parseCsv(ACC_SEED_ITEMS).slice(1); const txRows = parseCsv(ACC_SEED_TX).slice(1);
    ACC.seeding.total = itemRows.length + txRows.length; accRefresh();
    const ids = new Map([...ACC.items.entries()].map(([id, i]) => [fuzzyKey(i.name), id]));
    let k = 0;
    for (const [name, category, price, quick] of itemRows) {
      if (!ids.has(fuzzyKey(name))) {
        const id = "i" + String(++k).padStart(3, "0") + Math.random().toString(36).slice(2, 5);
        await accWrite("set", `${ACC_ITEMS}/${id}`, { name, category, usual_price: Number(price), quick_add: quick === "yes", price_locked: false, archived: false, created_at: now, created_by: S.uid });
        ids.set(fuzzyKey(name), id);
      }
      ACC.seeding.done++; if (ACC.seeding.done % 10 === 0) accRefresh();
    }
    let seq = 0;
    for (const [date, type, item, category, amount, note] of txRows) {
      const iso = ddmmyyyyToISO(date); const amt = Number(amount); seq++;
      const id = "t" + iso.replaceAll("-", "") + String(seq).padStart(4, "0");
      const doc = type === "Received"
        ? { type: "received", date: iso, amount: amt, method: /amazon/i.test(item) ? "Amazon Pay" : "PhonePe", from: "", note: note || "", lines: [], category: "Received" }
        : { type: "expense", date: iso, amount: amt, category, note: note || "", spent_by: ACC.settings.default_spender || "Nandhini", lines: [{ item_id: ids.get(fuzzyKey(item)) || null, name: item, category, qty: 1, amount: amt }] };
      await accWrite("set", `${ACC_TX}/${id}`, { ...doc, review: needsReviewNote(note), seq, source: "whatsapp-2026", created_at: now, created_by: S.uid });
      ACC.seeding.done++; if (ACC.seeding.done % 10 === 0) accRefresh();
    }
    await accWrite("set", ACC_SETTINGS, { period: "10", default_spender: "Nandhini", categories: [], ...ACC.settings, seeded_at: now,
      written_last: { date: "2026-11-04", amount: 6378 }, ledger_checks: ACC_SEED_CHECKS.map(([label, diff]) => ({ label, diff })) });
    writeAudit("accounts.seed", null, "accounts", null, { entries: txRows.length, items: itemRows.length });
    flash(`Imported the WhatsApp ledger: ${txRows.length} entries and ${itemRows.length} items.`);
  } catch (e) { flash(dbErrorText(e).replace("save this bill", "import the ledger")); }
  finally { ACC.seeding = null; accRefresh(); }
}
function accMaybeSeed() {
  if (!ACC.loaded.items || !ACC.loaded.tx || !ACC.loaded.settings || ACC.seeding || ACC.settings.seeded_at || ACC.tx.size) return;
  if (S.tab === "accounts" && S.me?.isOwner && canAccManage()) accSeed(true);   // runs when the owner first opens Accounts

function summaryCard() {
  const b = rangeBounds(); const tot = totalsBetween(b.start, b.end); const now = availableNow();
  const cats = Object.entries(tot.cats).sort((x, y) => y[1] - x[1]); const max = Math.max(1, ...cats.map(([, v]) => v));

}
function txTitle(t) { return t.type === "received" ? `Money received${t.method ? ` (${t.method})` : ""}${t.from ? ` from ${t.from}` : ""}` : (t.lines || []).map((l) => (l.qty > 1 ? `${l.name} × ${l.qty}` : l.name)).join(" & "); }

async function saveExpense(force) {
  const f = ACC.form; const v = f.values; const errBox = $("#ef-err"); const err = (m) => { errBox.innerHTML = `<div class="note bad">${esc(m)}</div>`; };
  if (!isISODate(v.date)) return err("Pick the date.");
  const lines = [];
  for (const [i, l] of v.lines.entries()) {
    const name = l.name.trim(); const amt = parseRupees(l.amount); const qty = parseRupees(l.qty || "1");
    if (!name && amt == null) continue;
    if (!name) return err(`Item ${i + 1}: enter what was bought.`);
    if (amt == null || Number.isNaN(amt) || amt <= 0) return err(`Item ${i + 1}: amount must be whole rupees, like 116.`);
    if (qty == null || Number.isNaN(qty) || qty < 1) return err(`Item ${i + 1}: quantity must be 1 or more.`);
    lines.push({ name, amt, qty, category: l.category || "Other", item_id: lineMatch(l)?.[0] || null, addNew: !!l.addNew });
  }
  if (!lines.length) return err("Add at least one item with its amount.");
  const total = lines.reduce((a, l) => a + l.amt, 0);
  const after = availableNow() + (f.id ? ACC.tx.get(f.id)?.amount || 0 : 0) - total;
  if (after < 0 && !force) { errBox.innerHTML = `<div class="note warn confirm"><span>This takes the balance below zero (${inr(after)}). Save anyway?</span><button type="button" class="btn btn-primary" data-act="acc-save-anyway">Save anyway</button></div>`; errBox.scrollIntoView({ block: "center" }); return; }
  const now = new Date().toISOString();
  try {
    for (const l of lines) if (!l.item_id && l.addNew) {
      const id = "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
      await accWrite("set", `${ACC_ITEMS}/${id}`, { name: l.name, category: l.category, usual_price: Math.round(l.amt / l.qty), quick_add: false, price_locked: false, archived: false, created_at: now, created_by: S.uid });
      l.item_id = id;
    }
    const prevStats = itemStats();
    const doc = { type: "expense", date: v.date, amount: total, category: [...new Set(lines.map((l) => l.category))].length === 1 ? lines[0].category : "Mixed",
      lines: lines.map((l) => ({ item_id: l.item_id, name: l.name, category: l.category, qty: l.qty, amount: l.amt })), note: v.note.trim(), spent_by: v.spent_by.trim(), updated_at: now, updated_by: S.uid };
    if (f.id) {

    ACC.form = null; ACC.view = "entries";
  } catch (e) { return err(dbErrorText(e).replace("save this bill", "save this expense")); }
  render(); window.scrollTo(0, 0);
}

function accCsv() {
  const b = rangeBounds(); const rows = txList().filter((t) => (!b.start || t.date >= b.start) && (!b.end || t.date <= b.end));
  const lines = [["date", "type", "item", "category", "amount", "qty", "note", "method", "from", "spent_by", "needs_review", "balance_after_day"]];
  for (const t of rows) lines.push([dmy(t.date), t.type === "received" ? "Received" : "Expense", t.type === "received" ? txTitle(t) : (t.lines || []).map((l) => l.name).join(" & "), txCats(t), t.amount,
    t.type === "expense" ? (t.lines || []).reduce((a, l) => a + (l.qty || 1), 0) : "", t.note || "", t.method || "", t.from || "", t.spent_by || "", t.review ? "yes" : "", balanceThrough(t.date)]);
  return "﻿" + lines.map((l) => l.map(csvCell).join(",")).join("\r\n") + "\r\n";
}
async function accStatementPdf(p) {
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js");
  const tot = totalsBetween(p.start, p.end); const doc = new window.jspdf.jsPDF({ unit: "pt", format: "a4" });
  doc.setFontSize(15); doc.text(`Accounts statement ${dmy(p.start)} – ${dmy(p.end)}`, 40, 42);
  doc.setFontSize(10); doc.setTextColor(90); doc.text(`Opening Rs ${grouped(tot.opening)} · received Rs ${grouped(tot.received)} · spent Rs ${grouped(tot.spent)} · closing Rs ${grouped(tot.closing)}`, 40, 60);
  let bal = tot.opening; const body = [["", "Opening balance", "", "", "", grouped(bal)]];
  for (const t of txList().filter((x) => x.date >= p.start && x.date <= p.end)) { bal += signed(t); body.push([dmy(t.date), txTitle(t), txCats(t), t.type === "received" ? grouped(t.amount) : "", t.type === "expense" ? grouped(t.amount) : "", grouped(bal)]); }
  body.push(["", "Closing balance", "", grouped(tot.received), grouped(tot.spent), grouped(tot.closing)]);
  doc.autoTable({ startY: 74, head: [["Date", "Item", "Category", "Received", "Spent", "Balance"]], body, styles: { fontSize: 9, cellPadding: 4 }, headStyles: { fillColor: [15, 110, 102] },
    columnStyles: { 3: { halign: "right" }, 4: { halign: "right" }, 5: { halign: "right" } },
    didParseCell: (d) => { if (d.section === "body" && (d.row.index === 0 || d.row.index === body.length - 1)) d.cell.styles.fontStyle = "bold"; } });
  return doc.output("blob");
}
function buildAccImport(text) {
  const rows = parseCsv(text); if (rows.length < 2) throw new Error("That file has no entries.");
  const head = rows[0].map((h) => h.trim().toLowerCase().replace(/[^a-z]+/g, "_"));
  const ix = (n) => head.indexOf(n); const need = ["date", "type", "amount"].filter((n) => ix(n) < 0);
  if (need.length) throw new Error(`Missing column${need.length > 1 ? "s" : ""}: ${need.join(", ")}.`);
  const out = []; const errors = []; let received = 0, spent = 0, dups = 0;
  const existing = new Set([...ACC.tx.values()].map((t) => `${t.date}|${t.type}|${normName(txTitle(t))}|${t.amount}`));
  rows.slice(1).forEach((r, k) => {
    const line = k + 2; const get = (n) => (ix(n) >= 0 ? (r[ix(n)] || "").trim() : "");
    const date = ddmmyyyyToISO(get("date")); const amt = parseRupees(get("amount")); const type = /^rec/i.test(get("type")) ? "received" : /^exp/i.test(get("type")) ? "expense" : null;
    if (!date) return errors.push(`Line ${line}: date "${get("date")}" isn't DD/MM/YYYY.`);
    if (!type) return errors.push(`Line ${line}: type must be Received or Expense.`);
    if (amt == null || Number.isNaN(amt) || amt <= 0) return errors.push(`Line ${line}: amount "${get("amount")}" isn't whole rupees.`);
    const item = get("item") || (type === "received" ? "Money received" : "(item not written)"); const note = get("note");
    const t = type === "received" ? { type, date, amount: amt, method: get("method") || (/amazon/i.test(item) ? "Amazon Pay" : /phonepe/i.test(item) ? "PhonePe" : "Other"), from: get("from"), note, lines: [], category: "Received" }
      : { type, date, amount: amt, category: get("category") || "Other", note, spent_by: get("spent_by") || ACC.settings.default_spender || "Nandhini", lines: [{ item_id: itemByName(item)?.[0] || null, name: item, category: get("category") || "Other", qty: 1, amount: amt }] };
    if (existing.has(`${date}|${type}|${normName(txTitle(t))}|${amt}`)) dups++;
    if (type === "received") received += amt; else spent += amt;
    out.push({ ...t, review: needsReviewNote(note) });
  });
  return { rows: out, errors, received, spent, dups };
}

    l[t.dataset.lf] = t.value;
    if (t.dataset.lf === "name" || t.dataset.lf === "qty") {
      const m = lineMatch(l); const box = document.querySelector(`[data-line-box="${i}"]`);
      if (m) {
        const qty = Math.max(1, parseRupees(l.qty) || 1); l.item_id = m[0]; l.category = m[1].category || l.category;
        if (t.dataset.lf === "name" || !l.amountTyped) { l.amount = String(Math.round((m[1].usual_price || 0) * qty)); box.querySelector('[data-lf="amount"]').value = l.amount; }
        box.querySelector('[data-lf="category"]').value = l.category;
      } else l.item_id = null;
      const nb = box.querySelector("[data-newbox]");
      nb.innerHTML = l.name.trim() && !m ? `<label class="pick small"><input type="checkbox" data-line="${i}" data-lf="addNew" ${l.addNew ? "checked" : ""}> Add "${esc(l.name.trim())}" as a new item</label>` : m && m[1].name !== l.name.trim() ? `<span class="small muted">Matches item "${esc(m[1].name)}"</span>` : "";
    }
    if (t.dataset.lf === "amount") l.amountTyped = true;
    refreshExpenseTotals(); return;
  }
  if (f && t.dataset.ef) { f.values[t.dataset.ef] = t.value; return; }
  if (f && t.dataset.rf) { f.values[t.dataset.rf] = t.value; return; }
  if (ACC.itemForm && t.dataset.if && t.type !== "checkbox") {
    ACC.itemForm.values[t.dataset.if] = t.value;
    if (t.dataset.if === "name") { const dup = t.value.trim() && [...ACC.items.entries()].find(([id, i]) => id !== ACC.itemForm.id && fuzzyKey(i.name) === fuzzyKey(t.value)); $("#if-dup").innerHTML = dup ? `<div class="note warn small">This looks like <b>${esc(dup[1].name)}</b>${dup[1].archived ? " (archived)" : ""}, which already exists. You can still save if it's a different item.</div>` : ""; }
    return;
  }
  if (t.dataset.act === "acc-q") { ACC.q = t.value; clearTimeout(t._d); t._d = setTimeout(() => { const pos = t.selectionStart; render(); const n = $("#acc-q"); n?.focus(); n?.setSelectionRange(pos, pos); }, 250); }
});
document.addEventListener("change", async (e) => {
  const t = e.target; const f = ACC.form;
  if (f && t.dataset.lf === "addNew") { f.values.lines[Number(t.dataset.line)].addNew = t.checked; return; }
  if (f && t.dataset.lf === "category") { f.values.lines[Number(t.dataset.line)].category = t.value; return; }
  if (f && t.dataset.ef === "clearReview") { f.values.clearReview = t.checked; return; }
  if (f && t.dataset.rf === "method") { f.values.method = t.value; return; }
  if (ACC.itemForm && t.dataset.if) {
    if (t.dataset.if === "category") { ACC.itemForm.newCat = t.value === "__new"; if (!ACC.itemForm.newCat) ACC.itemForm.values.category = t.value; render(); $("#if-newcat")?.focus(); return; }
    if (t.type === "checkbox") { ACC.itemForm.values[t.dataset.if] = t.checked; return; }
  }
  const a = t.dataset.act;
  if (a === "acc-type") { ACC.type = t.value; render(); }
  if (a === "acc-cat") { ACC.cat = t.value; render(); }
  if (a === "acc-dates") { ACC.from = $("#acc-from").value; ACC.to = $("#acc-to").value; render(); }
  if (a === "acc-period-mode") { try { await accWrite(Object.keys(ACC.settings).length ? "update" : "set", ACC_SETTINGS, { period: t.value, ...(t.value === "14" && !ACC.settings.anchor ? { anchor: txList()[0]?.date || accTodayISO() } : {}) }); flash("Period length changed."); } catch (err) { flash(dbErrorText(err)); } render(); }
  if (a === "acc-spender") { try { await accWrite(Object.keys(ACC.settings).length ? "update" : "set", ACC_SETTINGS, { default_spender: t.value.trim() || "Nandhini" }); flash("Default \"Spent by\" saved."); } catch (err) { flash(dbErrorText(err)); } render(); }
  if (t.id === "acc-import-file") {
    const file = t.files?.[0]; t.value = ""; if (!file) return;
    try { ACC.importPreview = buildAccImport(await file.text()); } catch (err) { flash(err.message || "That CSV couldn't be read."); }
    render();
  }
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "acc-exp-form") { e.preventDefault(); saveExpense(false); }
  if (e.target.id === "acc-rec-form") { e.preventDefault(); saveReceived(); }
  if (e.target.id === "acc-item-form") { e.preventDefault(); saveItem(); }
});

boot();
</script>
