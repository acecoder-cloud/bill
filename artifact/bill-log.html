/* ---------- small helpers ---------- */
const drId = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const drDate = () => DR.date || todayISO();
const nowISO = () => new Date().toISOString();
function drMe() { try { return localStorage.getItem("pbl-dr-me") || ""; } catch { return ""; } }
function addMin(hm, m) { const [h, mi] = hm.split(":").map(Number); const t = Math.max(0, Math.min(24 * 60 - 1, h * 60 + mi + m)); return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`; }
function minutesOf(hm) { return /^\d{2}:\d{2}$/.test(hm || "") ? Number(hm.slice(0, 2)) * 60 + Number(hm.slice(3)) : 720; }
const slotName = (s) => (DR_SLOTS.find((x) => x[0] === s) || [s, s])[1];
const slotDue = (s) => (DR_SLOTS.find((x) => x[0] === s) || [])[2] || "23:59";
const withUnit = (v, u) => (!u ? `${v}` : /^[/%]/.test(u) ? `${v}${u}` : `${v} ${u}`);

function drTask(id) { const t = DR.tasks.get(id); return t ? { id, ...t } : null; }
function allTasks() { return [...DR.tasks.entries()].map(([id, t]) => ({ id, ...t })).sort((a, b) => (a.order || 0) - (b.order || 0) || a.name.localeCompare(b.name)); }

function staffList() { const r = (x) => STAFF_ROLES.findIndex(([k]) => k === x); return [...DR.staff.entries()].filter(([, s]) => !s.archived).map(([id, s]) => ({ id, ...s })).sort((a, b) => r(a.role) - r(b.role) || a.name.localeCompare(b.name)); }
function staffByName(n) { const k = personKey(n); return k ? staffList().find((s) => personKey(s.name) === k) || null : null; }
function byLabel(n) { if (!n) return ""; const s = staffByName(n); return s?.role === "nurse" ? `S/N ${s.name}` : n; }
async function ensureStaff(name, role = "family") {

async function dayWrite(d, patch) {
  const path = `${DR_DAYS}/${d}`;
  if (!DR.days.has(d)) await rouWrite("set", path, { date: d, created_at: nowISO(), ...patch });
  else await rouWrite("update", path, patch);
}
function parseSchedule(s) {
  const out = { kind: "daily", days: [], times: [], slots: [], target: 0, asNeeded: false }; s = String(s || "").trim();
  if (/^(as needed|multiple times)$/i.test(s)) { out.asNeeded = true; return out; }
  const tg = /^target (\d+)/i.exec(s); if (tg) { out.target = Number(tg[1]); return out; }
  if (/morning|afternoon|night/i.test(s) && !/\d/.test(s)) { out.slots = s.split(/;\s*/).map((x) => x.trim().toLowerCase()).filter((x) => SLOT_TIME[x]); return out; }
  out.times = (s.match(/\d{1,2}:\d{2}\s*[AP]M/gi) || []).map(to24).filter(Boolean); return out;
}
function schedSummary(t) {
  const when = t.kind === "once" ? `Only ${dmy(t.date)}` : t.kind === "weekdays" ? WEEK.filter(([n]) => (t.days || []).includes(n)).map(([, l]) => l).join(", ") : "Daily";
  const what = t.slots?.length ? t.slots.map(slotName).join(", ") : t.times?.length ? t.times.map(fmtTime).join(", ") : t.target ? `${t.target} per day` : t.asNeeded ? "as needed" : "";
  return [when, what].filter(Boolean).join(" · ");
}

/* ---------- which tasks belong to a day, and what is done ---------- */
function taskOn(t, d) {
  if (t.kind === "once") return t.date === d;
  if (t.from && d < t.from) return false;
  if (t.archived_from && d >= t.archived_from) return false;
  if (t.paused_from && d >= t.paused_from) return false;
  if ((t.pauses || []).some((p) => d >= p.from && d < p.to)) return false;
  if (t.kind === "weekdays" && !(t.days || []).includes(new Date(d + "T00:00:00").getDay())) return false;
  return true;
}
function occTime(o) { return o.time || (o.slot ? SLOT_TIME[o.slot] : "") || o.sched || "99:99"; }
function occsFor(day, tid) { return Object.entries(day.occ || {}).filter(([, o]) => o.task === tid && !o.deleted).map(([id, o]) => ({ id, ...o })).sort((a, b) => occTime(a).localeCompare(occTime(b)) || a.id.localeCompare(b.id)); }
function tasksFor(d, day = dayDoc(d)) { return allTasks().filter((t) => taskOn(t, d) || occsFor(day, t.id).length || (t.type === "qty" && Number(day.qty?.[t.id]))); }
function drSections(tasks) { const custom = [...new Set(tasks.map((t) => t.section).filter((s) => s && !DR_SECTIONS.includes(s)))]; const i = DR_SECTIONS.indexOf("Supplies used"); return [...DR_SECTIONS.slice(0, i), ...custom, ...DR_SECTIONS.slice(i)]; }
function unitState(d, rec, due) { if (rec) return rec.done === false ? "notdone" : "done"; const t = todayISO(); if (d < t) return "missed"; if (d === t && due && nowHM() > due) return "overdue"; return "pending"; }
/** Scheduled "units" of a task on a day (each fixed time, slot or session) matched with what was recorded. */
function taskUnits(t, d, day = dayDoc(d)) {
  const occs = occsFor(day, t.id); let units;
  if (t.type === "qty" || t.type === "text") units = [];
  else if (t.slots?.length) units = t.slots.map((s) => ({ key: "s:" + s, slot: s, label: slotName(s), due: slotDue(s) }));
  else if (t.times?.length) units = t.times.map((x) => ({ key: "t:" + x, sched: x, label: fmtTime(x), due: addMin(x, 30) }));
  else if (t.target) units = Array.from({ length: t.target }, (_, i) => ({ key: "n:" + i, label: `Session ${i + 1}` }));
  else if (t.asNeeded) units = [];
  else units = [{ key: "d", label: "Mark done" }];
  const used = new Set();
  for (const u of units) { const o = occs.find((x) => !used.has(x.id) && ((u.slot && x.slot === u.slot) || (u.sched && x.sched === u.sched))); if (o) { u.occ = o; used.add(o.id); } }
  for (const u of units) if (!u.occ && !u.slot) { const o = occs.find((x) => !used.has(x.id) && !x.slot); if (o) { u.occ = o; used.add(o.id); } }
  for (const u of units) u.state = unitState(d, u.occ, u.due);
  return { units, occs, extra: occs.filter((o) => !used.has(o.id)) };
}
function planFor(kind, d) { let best = null; for (const [id, p] of DR.plans) if (p.kind === kind && p.from <= d && (!best || p.from > best.from)) best = { id, ...p }; return best; }
function feedUnits(d, day = dayDoc(d)) {
  const items = planFor("feed", d)?.data?.items || []; const recs = Object.values(day.feed || {}).filter((r) => !r.deleted);
  const times = [...new Set([...items.map((x) => x.time), ...recs.map((r) => r.time)])].sort();
  return times.map((time) => { const rec = recs.find((r) => r.time === time) || null; return { time, planned: items.find((x) => x.time === time)?.item || "", rec, state: unitState(d, rec, addMin(time, 30)) }; });
}
function medUnits(d, day = dayDoc(d)) {
  const plan = planFor("meds", d)?.data?.slots || {};
  return DR_SLOTS.map(([slot, label, due]) => { const rec = day.meds?.[slot] && !day.meds[slot].deleted ? day.meds[slot] : null; const list = rec?.list || plan[slot] || [];
    return { slot, label, list, rec, state: unitState(d, rec, due) }; }).filter((u) => u.list.length || u.rec);
}
function dayStatus(d) {
  const day = dayDoc(d); const sec = {}; let total = 0, done = 0, overdue = 0;
  const add = (s, st) => { const x = (sec[s] = sec[s] || { total: 0, done: 0, overdue: 0 }); x.total++; total++; if (st === "done") { x.done++; done++; } if (st === "overdue") { x.overdue++; overdue++; } };
  for (const t of tasksFor(d, day)) for (const u of taskUnits(t, d, day).units) add(t.section, u.state);
  for (const u of feedUnits(d, day)) add("RT feed", u.state);
  for (const u of medUnits(d, day)) add("Medication", u.state);
  return { total, done, overdue, sec };
}

/* ---------- family updates checklist ---------- */
function updSlots(d) {
  const day = dayDoc(d); const t = todayISO(); const now = nowHM();
  return [...DR.updates.entries()].filter(([, u]) => !u.archived).sort((a, b) => (a[1].order || 0) - (b[1].order || 0)).flatMap(([id, u]) => (u.times || []).map((s) => {
    const key = `${id}_${s.at.replace(":", "")}`; const rec = day.updates?.[key]; const late = s.until || addMin(s.at, 30);
    const state = rec?.done ? "done" : d < t ? "missed" : d > t ? "upcoming" : now >= late ? "overdue" : now >= s.at ? "due" : "upcoming";
    return { id, key, name: u.name, note: u.note || "", at: s.at, until: s.until || "", rec, state };
  }));
}
function drAlertCount() { if (!DR.loaded.updates || !S.caps?.db) return 0; return updSlots(todayISO()).filter((s) => s.state === "due" || s.state === "overdue").length; }
function drAlertOnOpen() {
  if (DR.alerted || !DR.loaded.updates || !DR.loaded.days || !tabAllowed("routine")) return;
  DR.alerted = true; const n = drAlertCount();
  if (n) flash(`${n} family update${n === 1 ? " is" : "s are"} due or overdue. See Routine → Daily Routine → Updates.`);
}
function drNotifyTick() {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const d = todayISO(); const now = nowHM(); let sent = {}; try { sent = JSON.parse(localStorage.getItem("pbl-dr-notified") || "{}"); } catch {}
  const fire = (key, title, body) => { if (sent[key]) return; sent[key] = d; try { new Notification(title, { body, tag: key }); } catch {} };
  for (const s of updSlots(d)) if (s.state === "due" || s.state === "overdue") fire(d + s.key, "Family update due", `${s.name} – ${fmtTime(s.at)}${s.note ? " (" + s.note + ")" : ""}`);
  const day = dayDoc(d);
  for (const t of tasksFor(d, day)) if (t.reminder) for (const u of taskUnits(t, d, day).units) if (!u.occ && u.sched && now >= u.sched) fire(`${d}${t.id}${u.key}`, "Routine reminder", `${t.name} – ${u.label}`);
  for (const k of Object.keys(sent)) if (sent[k] !== d) delete sent[k];
  try { localStorage.setItem("pbl-dr-notified", JSON.stringify(sent)); } catch {}
}

/* ---------- loading ---------- */
function drStart() {
  const db = S.caps.db;
  const sub = (col, key) => db.collection(col).onSnapshot((snap) => { DR[key] = new Map(snap.docs.map((d) => [d.id, clone(d.data())])); reapplyOutbox(col); if (!snap.metadata.fromCache) DR.loaded[key] = true; drChanged(); }, () => { DR.loaded[key] = true; drChanged(); });
  sub(DR_TASKS, "tasks"); sub(DR_DAYS, "days"); sub(DR_PLANS, "plans"); sub(DR_STAFF, "staff"); sub(DR_UPD, "updates"); sub(DR_SCANS, "scans");
  S.caps.sample?.limits().then((l) => { DR.scanLimits = !!l?.images; }).catch(() => { DR.scanLimits = false; });
  setInterval(drTick, 30000);
}

  if (!S.me?.isOwner || !canRouManage()) return;

/* ---------- seed: template, medicines, feed plan, staff, updates and the filled sample day 04/11/2026 ---------- */
const drHasTemplate = () => [...DR.tasks.values()].some((t) => t.kind !== "once");
/** One-off tasks a scan created only because the template was missing, that now have a regular task with the same name. */
function drRelinkable() { return allTasks().filter((t) => t.kind === "once" && t.src).map((t) => ({ t, to: matchTask(t.name) })).filter((x) => x.to); }
async function drRelinkOnce() {
  DR.relinking = true; let moved = 0;
  try {
    const byDay = new Map(); for (const x of drRelinkable()) { if (!byDay.has(x.t.date)) byDay.set(x.t.date, []); byDay.get(x.t.date).push(x); }
    for (const [d, list] of byDay) {
      const day = dayDoc(d); const patch = {};
      for (const { t, to } of list) {
        const target = drTask(to); const taken = occsFor(day, to);
        for (const o of occsFor(day, t.id)) { const sched = schedFor(target, o.time, taken); taken.push({ ...o, sched }); (patch.occ = patch.occ || {})[o.id] = { task: to, sched: sched || null }; moved++; }
      }
      if (patch.occ) await dayWrite(d, patch);
      for (const { t } of list) await rouWrite("delete", `${DR_TASKS}/${t.id}`);
    }
    if (moved) { writeAudit("routine.relink", null, "routine", null, { moved }); flash(`Moved ${moved} scanned entr${moved === 1 ? "y" : "ies"} onto the routine tasks. Open the scan again to add anything it couldn't place before (such as vitals).`); }
  } catch (e) { flash(dbErrorText(e)); }
  finally { DR.relinking = false; rouRefresh(); }
}
function drSeedWrites() {
  const now = nowISO(); const W = []; const ids = new Map();
  parseCsv(DR_SEED_TASKS).slice(1).forEach(([section, name, type, unit, sched, details], i) => {
    if (!name) return; const id = "t" + String(i + 1).padStart(3, "0"); ids.set(name, id);
    W.push([`${DR_TASKS}/${id}`, { section, name, type: DR_TYPE_CSV[type] || "check", unit: unit || "", ...parseSchedule(sched), date: null, details: details || "", doer: "", reminder: false,
      order: (i + 1) * 10, from: DR_START, pauses: [], paused_from: null, archived_from: null, created_at: now, created_by: S.uid }]);

async function drSeed(auto) {
  if (DR.seeding || !canRouManage()) return;
  if (drHasTemplate()) { flash("The daily routine was already loaded."); return; }
  DR.seedFailed = false; DR.seeding = { done: 0, total: 0 }; rouRefresh();
  try {
    if (auto) {
      const lease = await S.caps.db.doc(DR_LOCK).acquire({ holder: S.uid, ttlMs: 60000 }).catch(() => ({ acquired: true }));
      if (!lease.acquired) return;
      const fresh = await S.caps.db.doc(ROU_SETTINGS).get().catch(() => null);
      if (fresh?.exists && fresh.data().daily_seeded_at) return;
    }
    const W = drSeedWrites(); DR.seeding.total = W.length;
    for (const [path, doc] of W) { await rouWrite("set", path, doc); DR.seeding.done++; if (DR.seeding.done % 10 === 0) rouRefresh(); }
    await rouWrite("set", ROU_SETTINGS, { ...ROU.settings, daily_seeded_at: nowISO() });
    const nt = W.filter(([p]) => p.startsWith(DR_TASKS)).length, ns = W.filter(([p]) => p.startsWith(DR_STAFF)).length;
    writeAudit("routine.daily_seed", null, "routine", null, { tasks: nt, staff: ns });
    if (drRelinkable().length) await drRelinkOnce();
    flash(`Loaded the daily routine: ${nt} tasks, the medicine list and feed plan, ${ns} staff, the update checklist and the sample day 04/11/2026.`);
  } catch (e) { DR.seedFailed = true; flash(dbErrorText(e).replace("save this bill", "load the daily routine") + " Use “Load the routine template” to try again."); }
  finally { DR.seeding = null; rouRefresh(); }
}

async function saveEdit() {

/* ---------- report (WhatsApp, PDF) ---------- */
function drReport(d) {
  const day = dayDoc(d); const tasks = tasksFor(d, day); const out = []; const tm = (o) => (o.time ? fmtTime(o.time) + (o.end ? ` to ${fmtTime(o.end)}` : "") : "");

    if (sec === "Medication") for (const u of medUnits(d, day)) { if (!u.rec) { rows.push({ name: u.label, state: u.state }); continue; }
      const no = u.list.filter((m, i) => u.rec.given?.[i] === false); rows.push({ name: u.label, when: u.rec.time ? fmtTime(u.rec.time) : "", detail: u.list.filter((m, i) => u.rec.given?.[i] !== false).join(", ") + (no.length ? ` (not given: ${no.join(", ")})` : ""), state: "done", by: byLabel(u.rec.by) }); }
    if (sec === "Vitals") for (const [s, label] of DR_SLOTS) { const st = mine.filter((t) => t.type === "value" && t.slots?.includes(s)); if (!st.length) continue; let any = false;
      for (const t of st) { const o = occsFor(day, t.id).find((x) => x.slot === s); if (o) { any = true; rows.push({ kind: "v", name: t.name, detail: withUnit(o.value, t.unit), when: label, by: byLabel(o.by) }); } }
      if (!any) rows.push({ name: `${label} vitals`, state: unitState(d, null, slotDue(s)) }); }
    if (sec === "Doctor's comment") for (const c of Object.values(day.doctors || {}).filter((c) => !c.deleted).sort((a, b) => (a.time || "99").localeCompare(b.time || "99"))) rows.push({ name: c.name || "Note", when: c.time ? fmtTime(c.time) : "", detail: c.comment });
    if (sec === "Visitors") { const vs = visitList().filter((v) => v.date === d); for (const v of vs) rows.push({ name: fmtTime(v.time), detail: (v.visitors || []).map((x) => [visitorLabel(x), x.place].filter(Boolean).join(", ")).join("; ") + (VISIT_TYPES[v.type].wa ? ` (${VISIT_TYPES[v.type].wa})` : "") }); if (!vs.length) rows.push({ name: "None" }); }
    if (sec === "Notes") for (const [k, l] of NOTE_KEYS) rows.push({ name: l, detail: day.notes?.[k] || "None" });
    for (const t of mine) {
      if (sec === "Vitals" && t.type === "value" && t.slots?.length) continue;
      if (t.type === "qty") { const n = Number(day.qty?.[t.id] || 0); if (n) rows.push({ name: t.name, detail: `${n}${t.unit ? " " + t.unit : ""}` }); continue; }
      const { units, occs } = taskUnits(t, d, day);
      if (t.type === "text") { for (const o of occs) rows.push({ name: t.name, detail: o.text, by: byLabel(o.by) }); continue; }
      if (t.type === "value") for (const o of occs) rows.push({ kind: "v", name: t.name, detail: withUnit(o.value, t.unit), when: o.slot ? slotName(o.slot) : tm(o), by: byLabel(o.by) });
      else if (t.type === "multi") { const ok = occs.filter((o) => o.done !== false); if (occs.length) rows.push({ name: t.name, when: ok.map(tm).filter(Boolean).join(", "), state: ok.length ? "done" : "notdone", count: t.target ? `${ok.length} of ${t.target}` : "", by: [...new Set(ok.map((o) => byLabel(o.by)).filter(Boolean))].join(", ") }); }

function drCsv() {

      L.push([dmy(d), t.section, t.name, o.slot ? slotName(o.slot) : o.sched ? fmtTime(o.sched) : "", fmtTime(o.time), fmtTime(o.end), o.value || o.text || "", t.unit, o.item, "", o.done === false ? "Not done" : "Done", o.by, o.note]); }

  if (DR.tables) return `<section class="card">${head}<div class="tbl-wrap"><table><thead><tr><th>When</th>${series.map((s) => `<th class="r">${esc(s.name)}</th>`).join("")}</tr></thead><tbody>${[...new Set(pts.map((p) => p.when))].map((w) => `<tr><td>${esc(w)}</td>${series.map((s) => `<td class="r num">${s.pts.find((p) => p.when === w)?.y ?? "—"}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`;
  const W = 320, H = 140, L = 30, R = 8, T = 8, B = 18; const ys = pts.map((p) => p.y); let lo = Math.min(...ys), hi = Math.max(...ys); if (hi - lo < 2) { lo -= 1; hi += 1; } const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;

    <svg viewBox="0 0 ${W} ${H}" class="dr-svg" role="img" aria-label="${esc(title)}: ${pts.length} readings from ${r1(Math.min(...ys))} to ${r1(Math.max(...ys))}. Switch to tables for exact numbers.">
      <line class="grid" x1="${L}" x2="${W - R}" y1="${T}" y2="${T}"/><line class="grid" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>
      <text class="axis" x="${L - 4}" y="${T + 4}" text-anchor="end">${r1(hi)}</text><text class="axis" x="${L - 4}" y="${H - B}" text-anchor="end">${r1(lo)}</text>

    </svg><p class="small muted dr-tip">Tap a point to read it.</p></section>`;
}

/* ================= Scan notebook → Daily Routine (photo or PDF → reviewed, merged day) ================= */
/* routine/scans/list/<id>  {date, status: pending|reading|review|saved|failed, pages: [assetId], pdfs: [assetId], page_count, source,

  db: null,

/** Straighten (EXIF), shrink to ~2000 px on the long side, lift contrast a little, JPEG 0.85. */
async function prepPage(file) {

/* ---------- reading ---------- */

function scanPrompt(date, n) {

const scanStr = (x) => (x == null ? "" : String(x).trim());
const scanConf = (x) => (["high", "medium", "low"].includes(x) ? x : "medium");
function scanTime(x) { x = scanStr(x); if (!x) return ""; const t = to24(x); if (t) return t; const m = /^(\d{1,2})[:.](\d{2})$/.exec(x); return m ? `${m[1].padStart(2, "0")}:${m[2]}` : ""; }
function scanDate(x) { const m = /^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2}|\d{4})$/.exec(scanStr(x)); if (!m) return isISODate(x) ? x : ""; const y = m[3].length === 2 ? "20" + m[3] : m[3]; const iso = `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`; return isISODate(iso) ? iso : ""; }
function scanNum(x) { if (x == null || x === "") return ""; const n = parseFloat(String(x).replace(/[^\d.]/g, "")); return Number.isFinite(n) ? String(n) : ""; }
/** Turn whatever came back into a tidy, predictable shape (never trust the reply blindly). */
function normScan(raw) {
  const o = raw && typeof raw === "object" ? raw : {}; const arr = (x) => (Array.isArray(x) ? x.filter((r) => r && typeof r === "object") : []); const pg = (r) => (Number.isInteger(r?.page_index) ? r.page_index : null);
  const slotObj = (x, f) => Object.fromEntries(DR_SLOTS.map(([s]) => [s, x && typeof x === "object" && x[s] && typeof x[s] === "object" ? f(x[s]) : null]));

    date: scanDate(o.date), pages: arr(o.pages).map((p) => ({ page: pg(p), date: scanDate(p.date), conf: scanConf(p.date_confidence) })),
    care: arr(o.care).map((r) => ({ task: scanStr(r.task), by: scanStr(r.done_by), time: scanTime(r.from), end: scanTime(r.to), details: scanStr(r.details), raw: scanStr(r.raw), conf: scanConf(r.confidence), page: pg(r) })),
    nebulizer: slotObj(o.nebulizer, (r) => ({ items: scanStr(Array.isArray(r.items) ? r.items.join(" + ") : r.items), by: scanStr(r.staff_nurse), conf: scanConf(r.confidence), page: pg(r) })),

    oral_feed: arr(o.oral_feed).map((r) => ({ meal: scanStr(r.meal), item: scanStr(r.item), time: scanTime(r.time), conf: scanConf(r.confidence), page: pg(r) })).filter((r) => r.meal && (r.item || r.time)),
    output: arr(o.output).map((r) => ({ type: scanStr(r.type) || "Urine", ml: scanNum(r.ml), time: scanTime(r.from), end: scanTime(r.to), conf: scanConf(r.confidence), page: pg(r) })),
    doctor_comments: arr(o.doctor_comments).map((r) => ({ name: scanStr(r.doctor), time: scanTime(r.time), comment: scanStr(r.comment), conf: scanConf(r.confidence), page: pg(r) })).filter((r) => r.comment || r.name),
    physio: arr(o.physio).map((r) => ({ task: scanStr(r.task), by: scanStr(r.by), time: scanTime(r.from), end: scanTime(r.to), details: scanStr(r.details), raw: scanStr(r.raw), conf: scanConf(r.confidence), page: pg(r) })).filter((r) => r.task),
    visitors: arr(o.visitors).map((r) => ({ time: scanTime(r.time), name: scanStr(r.name), place: scanStr(r.place), type: /video/i.test(r.type || "") ? "video" : /voice|call/i.test(r.type || "") ? "voice" : "in_person", raw: scanStr(r.raw), conf: scanConf(r.confidence), page: pg(r) })),
    notes: { room: scanStr(o.room_issues), improvement: scanStr(o.improvements), other: scanStr(o.other_discussion) },

/** Several calls when there are more pages than one call takes; later readings fill gaps, lists are joined. */
function mergeScanResults(rs) {
  if (rs.length === 1) return rs[0]; const out = normScan({});
  for (const r of rs) {
    out.date = out.date || r.date; out.pages.push(...r.pages);
    for (const k of ["care", "rt_feed", "oral_feed", "output", "doctor_comments", "physio", "visitors", "unmatched"]) out[k].push(...r[k]);
    for (const k of ["nebulizer", "medication", "vitals"]) for (const [s] of DR_SLOTS) out[k][s] = out[k][s] || r[k][s];
    for (const k of Object.keys(out.notes)) out.notes[k] = [out.notes[k], r.notes[k]].filter(Boolean).join("; ");
  }

}
async function scanRead(blobs, date) {
  const sample = S.caps.sample; if (!sample) throw { message: "Reading photos with Claude isn't available in this view." };
  const lim = await sample.limits().catch(() => null); if (!lim?.images) throw { code: "images_unavailable" };
  const per = Math.max(1, lim.images.maxCount || 5); const tier = ROU.settings.scan_model === "complex" ? "complex" : undefined; const results = [];
  for (let i = 0; i < blobs.length; i += per) {
    const chunk = blobs.slice(i, i + per);
    results.push(normScan(await sample.json(scanPrompt(date, chunk.length) + (i ? `\nThese are pages ${i + 1}–${i + chunk.length}; number page_index from 1 within this set.` : ""), { images: chunk, ...(tier ? { modelTier: tier } : {}) })));
    if (i) for (const k of ["care", "rt_feed", "oral_feed", "output", "doctor_comments", "physio", "visitors"]) for (const r of results.at(-1)[k]) if (r.page) r.page += i;
  }

}
async function startScanRead() {
  const sc = DR.scan; if (!sc?.pages.length) return;
  if (!localNoticeSeen()) { if (!sc.notice) { sc.notice = true; render(); return; } try { localStorage.setItem("pbl-scan-notice", "1"); } catch {} }
  const id = drId("sc"); const blobs = sc.pages.map((p) => p.blob); scanBlobs.set(id, blobs);
  await idbScan.put(id, { pages: blobs, pdfs: sc.pdfs || [] });
  try { await rouWrite("set", `${DR_SCANS}/${id}`, { date: sc.date, status: "pending", pages: [], pdfs: [], page_count: blobs.length, source: sc.source || "photo", result: null, error: "", created_at: nowISO(), created_by: S.uid, by: drMe() }); }
  catch (e) { sc.err = dbErrorText(e); render(); return; }
  for (const p of sc.pages) URL.revokeObjectURL(p.url);
  DR.scan = null;
  if (!navigator.onLine) { flash(`Saved ${blobs.length} page${blobs.length === 1 ? "" : "s"} as Pending reading. They will be read when you're back online.`); render(); return; }
  render(); await readScan(id, true);
}
async function scanPageBlobs(id) {
  if (scanBlobs.has(id)) return scanBlobs.get(id);
  const local = await idbScan.get(id); if (local?.pages?.length) { scanBlobs.set(id, local.pages); return local.pages; }
  const s = DR.scans.get(id); if (!s?.pages?.length) return [];
  const blobs = await Promise.all(s.pages.map((a) => fetch("/_blob/" + a).then((r) => { if (!r.ok) throw new Error("page"); return r.blob(); })));
  scanBlobs.set(id, blobs); return blobs;
}
const scanReading = new Set();
/** Upload the pages (if not yet), read them with Claude, then wait for review. Safe to call again for pending scans. */
async function readScan(id, openAfter) {
  if (scanReading.has(id)) return; const path = `${DR_SCANS}/${id}`; let s = DR.scans.get(id); if (!s) return;

    const blobs = await scanPageBlobs(id).catch(() => []);

      const pages = []; for (const b of blobs) pages.push((await S.caps.assets.upload(b, { type: "image/jpeg" })).id);
      const pdfs = []; for (const f of (await idbScan.get(id))?.pdfs || []) { try { pdfs.push((await S.caps.assets.upload(f, { type: "application/pdf" })).id); } catch {} }

    ${rs.st === "conflict" ? `<div class="seg" role="group" aria-label="Which value to keep"><button data-act="scan-choice" data-id="${it.id}" data-v="keep" aria-pressed="${it.choice === "keep"}">Keep saved</button><button data-act="scan-choice" data-id="${it.id}" data-v="scan" aria-pressed="${it.choice === "scan"}">Use scan</button>${it.kind === "note" ? `<button data-act="scan-choice" data-id="${it.id}" data-v="both" aria-pressed="${it.choice === "both"}">Keep both</button>` : ""}</div>` : ""}
    ${["new", "fill", "conflict", "needs", "text"].includes(rs.st) && it.kind !== "text" ? `<label class="pick small"><input type="checkbox" data-rinc="${it.id}" ${it.include ? "checked" : ""}> Include this</label>` : ""}
  </div>`;
}
function reviewExisting(it, rs) {
  const ex = rs.ex; if (!ex) return "";
  const show = (o, keys) => keys.map((k) => (o[k] ? `${k === "time" || k === "end" || k === "given_at" ? fmtTime(o[k]) : o[k]}` : "")).filter(Boolean).join(" · ");
  let txt = "";
  if (it.kind === "occ") txt = show(ex, ["time", "end", "item", "value", "text", "by", "note"]);
  else if (it.kind === "feed") txt = show(ex, ["item", "by", "given_at"]);
  else if (it.kind === "meds") txt = `${(ex.list || []).filter((m, i) => ex.given?.[i] !== false).join(", ")} · ${ex.by || ""}`;
  else if (it.kind === "vitals") txt = VITAL_TASKS.filter(([k]) => ex[k]).map(([k, n]) => `${VITAL_SHORT[n] || n} ${ex[k].value}`).join(" · ") + (Object.values(ex).find((o) => o?.by)?.by ? ` · ${Object.values(ex).find((o) => o?.by).by}` : "");
  else if (it.kind === "doc") txt = show(ex, ["name", "time", "comment"]);
  else if (it.kind === "note") txt = ex;
  else if (it.kind === "visit") txt = `${fmtTime(ex.time)} · ${(ex.visitors || []).map(visitorLabel).join(", ")}`;
  const manual = it.kind === "note" ? !dayDoc(DR.review.date).notes_src?.[it.v.key] : it.kind === "vitals" ? Object.values(ex).some((o) => o && !o.src) : !ex.src;
  return `<div class="small scan-saved">${rs.st === "same" ? "Already saved:" : `Saved${manual ? " (entered by hand)" : " (from an earlier scan)"}:`} ${esc(txt)}</div>`;
}
/* --- save: put everything in place --- */
async function saveReview() {
  const R = DR.review; const date = R.date; const scanId = R.id; const now = nowISO();
  const patch = { occ: {}, feed: {}, meds: {}, doctors: {}, notes: {}, notes_src: {} }; let added = 0, kept = 0, sameN = 0; const later = [];
  const pick = (f, k, a, b, choice) => (f[k] === "fill" ? a : f[k] === "conflict" ? (choice === "scan" ? a : b) : b || a);
  for (const it of R.items) {
    const rs = reviewStatus(it, date); const v = it.v;
    if (rs.st === "same") { sameN++; continue; }
    if (it.kind === "text") { if (v.assign && v.text.trim()) later.push(it); continue; }
    if (!it.include || rs.st === "needs") continue;
    if (rs.st === "conflict" && it.choice === "keep" && !Object.values(rs.f || {}).includes("fill")) { kept++; continue; }
    if (rs.st === "conflict" && it.choice === "keep") kept++;
    if (it.kind === "occ") {
      if (v.tid === "__once") { later.push(it); continue; }
      const t = drTask(v.tid); const base = { task: t.id, sched: rs.sched || rs.ex?.sched || null, slot: null, deleted: false, done: true, at: now, who: S.uid };
      if (rs.st === "new") patch.occ[drId("o")] = { ...base, time: v.time, end: v.end, by: v.by, item: v.item, value: v.value, text: v.text, note: v.note, src: scanId };
      else { const m = {}; for (const k of OCC_KEYS) m[k] = pick(rs.f, k, scanStr(v[k]), rs.ex[k] || "", it.choice); patch.occ[rs.ex.id] = { ...m, sched: base.sched, src: it.choice === "scan" ? scanId : rs.ex.src || null }; }
    } else if (it.kind === "feed") {
      const ex = rs.ex || {}; const f = rs.f || { item: "fill", by: "fill" };
      patch.feed[feedKey(v.time)] = { time: v.time, item: pick(f, "item", v.item, ex.item || "", it.choice), by: pick(f, "by", v.by, ex.by || "", it.choice), given_at: ex.given_at || v.time, note: ex.note || "", done: true, deleted: false, at: now, src: rs.st === "new" || it.choice === "scan" ? scanId : ex.src || null };
    } else if (it.kind === "meds") {
      const ex = rs.ex; const ch = medChoice(it, date); const useScan = rs.st === "new" || it.choice === "scan";
      if (useScan) patch.meds[v.slot] = { list: ch.filter((m) => m.inPlan || m.on).map((m) => m.name), given: ch.filter((m) => m.inPlan || m.on).map((m) => m.on), by: v.by || ex?.by || "", time: ex?.time || "", done: true, deleted: false, at: now, src: scanId };
      else if (rs.f.by === "fill") patch.meds[v.slot] = { by: v.by };
    } else if (it.kind === "vitals") {
      for (const [k, name] of VITAL_TASKS) {
        if (!v[k] || (rs.f?.[k] === "conflict" && it.choice !== "scan") || rs.f?.[k] === "ok") continue;
        const tid = matchTask(name); const t = tid && drTask(tid); if (!t) continue; const o = rs.ex?.[k];
        const by = rs.f?.by === "conflict" && it.choice !== "scan" ? o?.by || v.by : v.by || o?.by || "";
        patch.occ[o?.id || drId("o")] = { task: t.id, sched: k === "sugar" ? t.times?.[0] || null : null, slot: k === "sugar" ? null : v.slot, time: o?.time || "", end: "", value: k === "bp" ? v[k].replace(/\s+/g, "") : v[k], item: "", text: "", by, note: o?.note || "", done: true, deleted: false, at: now, who: S.uid, src: scanId };
      }
    } else if (it.kind === "doc") {
      const ex = rs.ex; const key = ex ? Object.entries(dayDoc(date).doctors || {}).find(([, c]) => c === ex)?.[0] : drId("c");
      patch.doctors[key || drId("c")] = ex ? { name: pick(rs.f, "name", v.name, ex.name, it.choice), time: pick(rs.f, "time", v.time, ex.time, it.choice), comment: pick(rs.f, "comment", v.comment, ex.comment, it.choice), src: it.choice === "scan" ? scanId : ex.src || null }
        : { name: v.name, time: v.time, comment: v.comment, by: "", deleted: false, at: now, src: scanId };
    } else if (it.kind === "note") {
      const ex = scanStr(dayDoc(date).notes?.[v.key]); const text = rs.st === "new" ? v.text : it.choice === "both" ? `${ex}; ${v.text}` : it.choice === "scan" ? v.text : ex;
      if (text !== ex) { patch.notes[v.key] = text; patch.notes_src[v.key] = scanId; }
    } else if (it.kind === "visit") later.push(it);
    added++;
  }
  for (const it of later.filter((x) => x.kind === "text")) {
    const v = it.v; if (v.assign === "__once") continue;
    const ex = scanStr(patch.notes[v.assign] ?? dayDoc(date).notes?.[v.assign]); patch.notes[v.assign] = ex ? `${ex}; ${v.text.trim()}` : v.text.trim(); patch.notes_src[v.assign] = scanId; added++;
  }
  for (const k of Object.keys(patch)) if (!Object.keys(patch[k]).length) delete patch[k];
  try {
    for (const it of later) {
      if ((it.kind === "occ" && it.v.tid === "__once") || (it.kind === "text" && it.v.assign === "__once")) {
        const isText = it.kind === "text"; const tid = drId("t");
        await rouWrite("set", `${DR_TASKS}/${tid}`, { section: isText ? "Notes" : it.sec, name: isText ? "Note" : it.v.task || "Task", type: isText ? "text" : "check", unit: "", kind: "once", days: [], date, times: [], slots: [], target: 0, asNeeded: false, details: "", doer: "", reminder: false,
          order: Math.max(0, ...allTasks().map((t) => t.order || 0)) + 10, from: date, pauses: [], paused_from: null, archived_from: null, created_at: now, created_by: S.uid, src: scanId });
        (patch.occ = patch.occ || {})[drId("o")] = { task: tid, sched: null, slot: null, time: isText ? "" : it.v.time, end: isText ? "" : it.v.end, value: "", item: "", text: isText ? it.v.text : "", by: isText ? "" : it.v.by, note: isText ? "" : it.v.note, done: true, deleted: false, at: now, who: S.uid, src: scanId };
        added++;
      }
    }
    if (Object.keys(patch).length) await dayWrite(date, patch);
    for (const it of later.filter((x) => x.kind === "visit")) {
      const v = it.v; let p = findPerson(v.name);
      if (!p) { const pid = drId("p"); const doc = { title: "", name: v.name, place: v.place, relation: "", phone: "", archived: false, quick: null, created_at: now, created_by: S.uid }; await rouWrite("set", `${ROU_PEOPLE}/${pid}`, doc); p = { id: pid, ...doc }; }
      await rouWrite("set", `${ROU_VISITS}/${drId("v")}`, { date, time: v.time || "", end_time: null, type: v.type || "in_person", visitors: [{ person_id: p.id, title: p.title || "", name: p.name, place: v.place || p.place || "" }], note: "From notebook scan", review: false, src_scan: scanId, seq: Date.now(), created_at: now, created_by: S.uid });
    }
    const st = DR.scans.get(scanId) || {};
    await rouWrite("update", `${DR_SCANS}/${scanId}`, { status: "saved", saved_at: now, saved_date: date, saved_counts: { added, same: sameN, kept }, saves: (st.saves || 0) + 1 });
    if (ROU.settings.scan_ticks_update && date === todayISO()) {
      const s = updSlots(date).find((x) => fuzzyKey(x.name) === fuzzyKey("Daily Routine") && x.state !== "done" && x.state !== "overdue");
      if (s) await dayWrite(date, { updates: { [s.key]: { done: true, time: nowHM(), by: drMe() || "Notebook scan", at: now } } });
    }
    writeAudit("routine.scan_save", null, scanId, null, { date, added, same: sameN, kept });
  } catch (e) { flash(dbErrorText(e).replace("save this bill", "save the scan")); return; }
  (R.urls || []).forEach((u) => URL.revokeObjectURL(u));
  DR.review = null; DR.date = date === todayISO() ? null : date; DR.view = "day";
  flash(`Saved the scan to ${dmy(date)}: ${added} added, ${sameN} already there${kept ? `, ${kept} kept as entered` : ""}.`);
  render(); window.scrollTo(0, 0);
}
/* --- scan history strip on each day --- */
function scansStrip(d, ro) {
  const list = scansFor(d); if (!list.length) return "";
  return `<section class="card"><h2>Notebook scans</h2>${list.map((s) => `<div class="scan-row" data-scan="${esc(s.id)}">
    <div><b>📷 ${s.created_at ? new Date(s.created_at).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" }).toUpperCase() : ""}</b> <span class="small muted">${s.page_count || (s.pages || []).length} page${(s.page_count || 0) === 1 ? "" : "s"} · ${(s.source || "photos").split("+").map((x) => ({ pdf: "PDF", camera: "camera", photos: "photos" })[x] || x).join(" + ")}${s.by ? " · " + esc(s.by) : ""}${s.saved_counts ? ` · ${s.saved_counts.added} added` : ""}</span>
      <span class="pill ${s.status === "review" ? "warn" : s.status === "failed" ? "bad" : s.status === "saved" ? "ok" : ""}">${SCAN_STATUS[s.status] || s.status}</span>${s.error ? `<div class="small bad-ink">${esc(s.error)}</div>` : ""}</div>
    ${!ro ? `<div class="dr-mact">${s.result ? `<button class="btn-link" data-act="scan-open" data-id="${esc(s.id)}">${s.status === "review" ? "Review" : "Open"}</button>` : ""}
      ${s.status !== "reading" ? `<button class="btn-link" data-act="scan-reread" data-id="${esc(s.id)}">${s.status === "pending" ? "Read now" : "Re-read"}</button>` : ""}
      <button class="btn-link danger-text" data-act="scan-del" data-id="${esc(s.id)}">Delete</button></div>` : ""}
    ${DR.confirm === "scan:" + s.id ? `<div class="note bad confirm"><span>Delete this scan?${s.status === "saved" ? " Values already saved stay unless you remove them too." : ""}</span><button class="btn btn-danger" data-act="scan-del-yes" data-id="${esc(s.id)}" data-remove="0">Delete scan</button>${s.status === "saved" ? `<button class="btn btn-danger" data-act="scan-del-yes" data-id="${esc(s.id)}" data-remove="1">Delete and remove its values</button>` : ""}<button class="btn btn-ghost" data-act="dr-confirm-no">Keep</button></div>` : ""}
  </div>`).join("")}</section>`;
}
async function deleteScan(id, removeValues) {
  const s = DR.scans.get(id); DR.confirm = null;
  try {
    if (removeValues) {
      const d = s.saved_date || s.date; const day = dayDoc(d); const patch = {};
      for (const [k, o] of Object.entries(day.occ || {})) if (o.src === id && !o.deleted) (patch.occ = patch.occ || {})[k] = { deleted: true };
      for (const [k, r] of Object.entries(day.feed || {})) if (r.src === id && !r.deleted) (patch.feed = patch.feed || {})[k] = { deleted: true };
      for (const [k, r] of Object.entries(day.meds || {})) if (r.src === id && !r.deleted) (patch.meds = patch.meds || {})[k] = { deleted: true };
      for (const [k, c] of Object.entries(day.doctors || {})) if (c.src === id && !c.deleted) (patch.doctors = patch.doctors || {})[k] = { deleted: true };
      for (const [k, src] of Object.entries(day.notes_src || {})) if (src === id) { (patch.notes = patch.notes || {})[k] = ""; (patch.notes_src = patch.notes_src || {})[k] = null; }
      if (Object.keys(patch).length) await dayWrite(d, patch);
      for (const [vid, v] of ROU.visits) if (v.src_scan === id) await rouWrite("delete", `${ROU_VISITS}/${vid}`);
      for (const [tid, t] of DR.tasks) if (t.src === id) await rouWrite("delete", `${DR_TASKS}/${tid}`);
    }
    await rouWrite("delete", `${DR_SCANS}/${id}`); await idbScan.del(id); scanBlobs.delete(id);
    if (S.caps.assets) for (const a of [...(s.pages || []), ...(s.pdfs || [])]) S.caps.assets.delete(a).catch(() => {});
    writeAudit("routine.scan_delete", null, id, { date: s.saved_date || s.date }, { removed_values: !!removeValues });
    flash(removeValues ? "Scan and its values removed." : "Scan deleted. Saved values stay.");
  } catch (e) { flash(dbErrorText(e)); }
  render();
}
/* --- settings (Manage → Scanning) --- */
function scanSettingsView() {
  const ed = canRouManage(); const st = ROU.settings; const lim = DR.scanLimits;
  return `<section class="card"><h2>Scan notebook</h2>
    <p class="small muted">Reading uses Claude through claude.ai, the same way bills are read, so there is no API key to store. Page images are sent only when someone presses Read.</p>
    ${lim === false ? `<div class="note warn small">Reading photos with Claude isn't available in this view.</div>` : ""}
    <label class="pick"><input type="checkbox" data-scanset="scan_enabled" ${st.scan_enabled !== false ? "checked" : ""} ${ed ? "" : "disabled"}> “Scan notebook” is on</label>
    <label class="field"><span>Model</span><select class="inp" data-scanset="scan_model" ${ed ? "" : "disabled"}><option value="default" ${st.scan_model !== "complex" ? "selected" : ""}>Balanced (faster)</option><option value="complex" ${st.scan_model === "complex" ? "selected" : ""}>Most capable (better with hard handwriting, slower)</option></select></label>
    <label class="pick"><input type="checkbox" data-scanset="scan_ticks_update" ${st.scan_ticks_update ? "checked" : ""} ${ed ? "" : "disabled"}> Tick “Daily Routine” in the updates checklist when a scan is saved before it is due</label>
    ${ed ? "" : `<p class="small muted">Only the owner or an admin can change these.</p>`}

}
async function scanPdfAppendix(doc, d) {
  for (const s of scansFor(d)) {
    let blobs = []; try { blobs = await scanPageBlobs(s.id); } catch { continue; }
    for (const [i, b] of blobs.entries()) {
      try {
        const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
        const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
        doc.addPage(); const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(); doc.setFontSize(10); doc.setTextColor(90);
        doc.text(`Notebook scan ${s.created_at ? new Date(s.created_at).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" }) : ""} – page ${i + 1} of ${blobs.length}`, 40, 30);
        const k = Math.min((W - 80) / img.width, (H - 70) / img.height); doc.addImage(url, "JPEG", 40, 42, img.width * k, img.height * k);
      } catch {}
    }
  }
}

/* ---------- events ---------- */
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-act]"); if (!t || !t.dataset.act.startsWith("scan-")) return;
  const a = t.dataset.act; const sc = DR.scan; const R = DR.review; const id = t.dataset.id;
  switch (a) {
    case "scan-open-capture": openScan(); break;
    case "scan-cancel": (sc?.pages || []).forEach((p) => URL.revokeObjectURL(p.url)); DR.scan = null; render(); break;
    case "scan-cam": sc.camera = true; sc.retake = null; $("#scan-cam").click(); break;
    case "scan-cam-done": sc.camera = false; render(); break;
    case "scan-photos": $("#scan-photos").click(); break;
    case "scan-pdf": $("#scan-pdf").click(); break;
    case "scan-view": openViewer(sc.pages[Number(t.dataset.i)].url); break;
    case "scan-move": { const i = Number(t.dataset.i), j = i + Number(t.dataset.n); [sc.pages[i], sc.pages[j]] = [sc.pages[j], sc.pages[i]]; render(); break; }
    case "scan-del-page": { const [p] = sc.pages.splice(Number(t.dataset.i), 1); URL.revokeObjectURL(p.url); render(); break; }
    case "scan-retake": sc.retake = Number(t.dataset.i); $("#scan-cam").click(); break;
    case "scan-read": t.disabled = true; startScanRead(); break;
    case "scan-open": openReview(id); break;
    case "scan-reread": readScan(id, true); break;
    case "scan-del": DR.confirm = "scan:" + id; render(); break;
    case "scan-del-yes": deleteScan(id, t.dataset.remove === "1"); break;
    case "scan-review-close": (R?.urls || []).forEach((u) => URL.revokeObjectURL(u)); DR.review = null; render(); break;
    case "scan-zoom": openViewer(t.dataset.src); break;
    case "scan-choice": R.items.find((x) => x.id === id).choice = t.dataset.v; render(); break;
    case "scan-check-sec": {
      const sec = t.dataset.sec; const was = R.checked.includes(sec); R.checked = was ? R.checked.filter((x) => x !== sec) : [...R.checked, sec]; render();
      if (!was) { const all = [...document.querySelectorAll("[data-scansec]")]; const next = all.slice(all.findIndex((x) => x.dataset.scansec === sec) + 1).find((x) => !x.classList.contains("is-checked"));
        (next || $(".scan-actions"))?.scrollIntoView({ block: "start", behavior: "smooth" }); }
      break; }
    case "scan-set": { const it = R.items.find((x) => x.id === id); it.v[t.dataset.k] = t.dataset.v; render(); break; }
    case "scan-add-staff": { const n = t.dataset.name; const role = R.items.some((it) => it.kind === "doc" && it.v.name === n) ? "doctor" : "family"; await ensureStaff(n, role); flash(`${n} added to the staff list.`); render(); break; }
    case "scan-save": t.disabled = true; saveReview(); break;
    case "scan-discard": R.confirmDiscard = true; render(); break;
    case "scan-discard-no": R.confirmDiscard = false; render(); break;
    case "scan-discard-yes": { const sid = R.id; (R.urls || []).forEach((u) => URL.revokeObjectURL(u)); DR.review = null; await deleteScan(sid, false); break; }
  }
});
document.addEventListener("input", (e) => {
  const t = e.target; const R = DR.review;
  if (R && t.dataset.rv) { const it = R.items.find((x) => x.id === t.dataset.rv); if (it) it.v[t.dataset.k] = t.value; }
});
document.addEventListener("focusin", (e) => {   // tapping a field shows the page it was read from
  const item = e.target.closest?.(".scan-item"); const car = $("#scan-carousel"); if (!item || !car) return;
  const p = Number(item.dataset.page); if (p > 0 && car.children[p - 1]) car.scrollTo({ left: car.children[p - 1].offsetLeft - car.offsetLeft, behavior: "smooth" });
});
document.addEventListener("change", async (e) => {
  const t = e.target; const R = DR.review;
  if (R && t.dataset.rv) { const it = R.items.find((x) => x.id === t.dataset.rv); if (it) { it.v[t.dataset.k] = t.value; render(); } return; }
  if (R && t.dataset.rinc) { R.items.find((x) => x.id === t.dataset.rinc).include = t.checked; return; }
  if (R && t.dataset.rmed) { const it = R.items.find((x) => x.id === t.dataset.rmed); it.v.ticked = { ...(it.v.ticked || {}), [t.dataset.name]: t.checked }; render(); return; }
  if (R && t.dataset.rmatch) {
    if (!t.value) return; const it = R.items.find((x) => x.id === t.dataset.rmatch); const raw = it.v[t.dataset.k]; it.v[t.dataset.k] = t.value;
    for (const o of R.items) for (const k of ["by", "name"]) if (o.v[k] && personKey(o.v[k]) === personKey(raw)) o.v[k] = t.value;   // same handwriting elsewhere on the page
    const st = staffByName(t.value); if (st && canRouEdit()) rouWrite("update", `${DR_STAFF}/${st.id}`, { aliases: [...new Set([...(st.aliases || []), raw])] }).catch(() => {});   // next scans match it automatically
    render(); return;
  }
  if (R && t.id === "scan-date") { if (isISODate(t.value)) { R.date = t.value; render(); } return; }
  if (t.dataset.scanset) {
    const k = t.dataset.scanset; const val = t.type === "checkbox" ? t.checked : t.value;
    try { await rouWrite("set", ROU_SETTINGS, { ...ROU.settings, [k]: val }); } catch (x) { flash(dbErrorText(x)); }
    render(); return;
  }
  if (["scan-cam", "scan-photos", "scan-pdf"].includes(t.id)) {
    const files = [...(t.files || [])]; t.value = ""; if (!files.length || !DR.scan) return;
    const sc = DR.scan;
    if (t.id === "scan-cam" && sc.retake != null) { try { const b = await prepPage(files[0]); const old = sc.pages[sc.retake]; URL.revokeObjectURL(old.url); sc.pages[sc.retake] = { blob: b, url: URL.createObjectURL(b), from: "photo" }; } catch (x) { sc.err = x.message; } sc.retake = null; render(); return; }
    addScanFiles(files, t.id === "scan-pdf" ? "pdf" : t.id === "scan-cam" ? "camera" : "photos");
  }
});

boot();
