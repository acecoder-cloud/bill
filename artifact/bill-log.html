<style>

  --bad-bg: #fde8e7;

    --brand: #3fb9ab; --brand-ink: #062320; --brand-soft: #173a35;
    --warn-bg: #3a2d0c; --warn-line: #a17a1c; --warn-ink: #f6d58a;

  }
}

  --brand: #3fb9ab; --brand-ink: #062320; --brand-soft: #173a35;

.link { background: none; border: 0; color: var(--brand); font-weight: 700; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }

/* Editor */
.card.ed-top { flex-direction: row; gap: 12px; align-items: flex-end; }

.ed-fields { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 10px; }

@media (max-width: 420px) { .ed-fields { grid-template-columns: 1fr; } }

.thumb { width: 64px; height: 64px; flex: none; border-radius: 12px; border: 1px solid var(--line); overflow: hidden; padding: 0; background: var(--surface-2); cursor: pointer; }

.rows { display: flex; flex-direction: column; gap: 10px; }

.irow.is-bad { border: 2px solid var(--bad-line); }
.irow-top { display: flex; align-items: center; gap: 8px; }

.mm-hint { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--warn-ink); font-size: .9rem; }
.mm-hint[hidden] { display: none; }
.rows-head { display: none; }
@media (min-width: 680px) {
  .rows { gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }

  .rows-head { padding: 8px 11px; background: var(--surface-2); font-size: .8rem; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-bottom: 0; border-radius: var(--r) var(--r) 0 0; }
  .rows-head { margin-bottom: -16px; }
  .rows-head + .rows { border-radius: 0 0 var(--r) var(--r); }

  .irow:first-child { border-top: 0; }

  .nums label:nth-child(3) { order: 5; }

}
.foot {
  position: sticky; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); z-index: 10;
  background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(8px);

}

/* Steps */
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.steps li { display: flex; align-items: center; gap: 12px; font-size: 1.05rem; }

/* Report column picks */
.picks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pick { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; font-weight: 600; font-size: .92rem; }

.people { display: flex; flex-direction: column; }

.audit .pair { display: grid; gap: 8px; padding: 0 12px 12px; }
@media (min-width: 680px) { .audit .pair { grid-template-columns: 1fr 1fr; } }

/* Tabs */
.tabs {
  position: fixed; inset: auto 0 0; z-index: 25; background: color-mix(in srgb, var(--surface) 96%, transparent); backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabs-in { max-width: 860px; margin: 0 auto; display: flex; }
.tabs a { flex: 1; min-height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); text-decoration: none; font-size: .75rem; font-weight: 700; }
.tabs a svg { width: 24px; height: 24px; }
.tabs a[aria-current="page"] { color: var(--brand); }

/* Photo viewer */
.viewer { position: fixed; inset: 0; z-index: 60; background: #000; display: flex; flex-direction: column; color: #fff; }
.viewer-bar { display: flex; justify-content: space-between; align-items: center; padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); background: rgb(0 0 0 / .7); }
.viewer-bar button { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid rgb(255 255 255 / .3); background: transparent; color: #fff; font-weight: 700; cursor: pointer; }

.offline { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--warn-line); color: #2b1d00; text-align: center; font-weight: 700; font-size: .9rem; padding: 7px 16px; }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
</style>

<script>
"use strict";
/* ---------------- helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const moneyFmt = new Intl.NumberFormat("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n) => (n == null || !isFinite(n) ? "" : moneyFmt.format(n));
const qtyFmt = (n) => (n == null || !isFinite(n) ? "" : String(Number(Number(n).toFixed(3))));

async function use(name) { try { return window.claude?.use ? await window.claude.use(name) : null; } catch { return null; } }

  const [db, user, sample, assets, downloads] = await Promise.all(["db", "user", "sample", "assets", "downloads"].map(use));
  S.caps = { db, user, sample, assets, downloads };
  if (user) {
    const me = await user.me();
    S.me = me; S.uid = me.id; S.isAdmin = !!me.canEdit;
    const w = await user.can("data.write");
    S.canWrite = me.id ? (w === null ? true : w) : false;

function startWatching() {
  const { db } = S.caps;
  const slow = setTimeout(() => { if (S.dbState === "loading") { S.dbState = "slow"; render(); } }, 10000);
  watchPerson(S.uid);
  db.collection("bills").onSnapshot((snap) => {
    clearTimeout(slow);
    if (!snap.metadata.fromCache || S.dbState !== "ready") S.dbState = "ready";
    for (const d of snap.docs) watchPerson(d.id);
    scheduleRender();
  }, (e) => { clearTimeout(slow); S.dbState = "error"; S.dbError = e?.code; render(); });
}

  if (S.watched.size >= PEOPLE_WATCH_LIMIT) { S.watchCapHit = true; return; }
  const unsub = S.caps.db.collection(`bills/${uid}/list`).onSnapshot((snap) => {
    S.bills.set(uid, snap.docs.map((d) => ({ ...d.data(), id: d.id, owner: uid })));
    scheduleRender();

}

const EXTRACT_PROMPT = `You are reading a photo of a pharmacy bill (invoice / cash memo), usually from India.

async function processFile(file) {
  const ed = S.editor; if (!ed) return;
  const pdf = isPdf(file);
  if (!pdf) ed.previewUrl = URL.createObjectURL(file);
  const step = (s) => { if (S.editor === ed) { ed.step = s; renderEditor(); } };
  let blob, images, pdfNote = "";
  try {
    step("compress");
    if (pdf) {
      const lim = await S.caps.sample?.limits().catch(() => null);
      const r = await pdfToImages(file, Math.max(1, Math.min(lim?.images?.maxCount || 3, 5)));
      if (!r.images.length) throw new Error("That PDF has no pages.");
      images = r.images; blob = images[0]; ed.previewUrl = URL.createObjectURL(blob);
      if (r.pages > images.length) pdfNote = ` Only the first ${images.length} of ${r.pages} pages were read.`;
    } else { blob = await compressImage(file); images = [blob]; }
  }
  catch (e) { return finishExtract(ed, null, { tone: "warn", text: (e.message || "The bill couldn't be prepared.") + " Enter the items below." }); }
  step("read");
  const upload = S.caps.assets ? S.caps.assets.upload(blob, { type: "image/jpeg" }).then((r) => r.id) : Promise.resolve(null);
  const read = (async () => {
    const sample = S.caps.sample; if (!sample) throw { message: "Reading photos with Claude isn't available in this view." };
    const lim = await sample.limits().catch(() => null);
    if (!lim?.images) throw { code: "images_unavailable" };
    return normalizeExtraction(await sample.json(EXTRACT_PROMPT + (images.length > 1 ? `\nThe ${images.length} images are consecutive pages of one bill, in order.` : ""), { images }));
  })();
  const [up, rd] = await Promise.allSettled([upload, read]);
  if (S.editor !== ed) return;
  ed.imageId = up.status === "fulfilled" ? up.value : null;
  const photoNote = up.status === "rejected" ? " The photo couldn't be saved with the bill." : !S.caps.assets ? " Photos aren't saved with bills for your access level." : "";
  if (rd.status === "rejected") return finishExtract(ed, null, { tone: "warn", text: `${sampleErrorText(rd.reason)} Enter the items below.${photoNote}` });
  const x = rd.value;
  if (!x.is_bill) return finishExtract(ed, null, { tone: "warn", text: `This photo doesn't look like a bill. Retake it or enter the items below.${photoNote}` });
  if (!x.items.length) return finishExtract(ed, null, { tone: "warn", text: `No items could be read from this photo. Enter them below.${photoNote}` });
  finishExtract(ed, x, { tone: x.bill_date && !pdfNote ? "ok" : "warn", text: (x.bill_date ? `Read ${x.items.length} item${x.items.length === 1 ? "" : "s"}. Check every value against the bill before submitting.` : `Read ${x.items.length} item${x.items.length === 1 ? "" : "s"}, but no date was found. Set the bill date.`) + pdfNote + photoNote });
}

      ${ed.previewUrl ? `<img class="preview" src="${ed.previewUrl}" alt="Bill being read">` : ""}
      <ol class="steps">${order.map((s, i) => `<li class="${i < idx ? "done" : i > idx ? "todo" : ""}">${i < idx ? '<span class="dot">✓</span>' : i === idx ? '<span class="spin" aria-hidden="true"></span>' : '<span class="dot"></span>'}${labels[s]}</li>`).join("")}</ol>
      ${ed.step === "read" ? `<p class="small muted">This usually takes 10–40 seconds. The first time, claude.ai asks you to allow the page to use Claude.</p>` : ""}
    </div>`;
    return;
  }
  const ro = ed.mode === "edit" && !ed.canEdit;
  const hasPhoto = ed.imageId || ed.previewUrl;
  const photoSrc = ed.previewUrl || (ed.imageId ? "/_blob/" + ed.imageId : "");
  main.innerHTML = `
  <div class="row-between">
    <button class="btn-link" data-act="ed-back">‹ ${ed.mode === "new" ? "Cancel" : "Back"}</button>
    <h1 style="flex:1">${ed.mode === "new" ? "Review bill" : ro ? "Bill" : "Edit bill"}</h1>
  </div>
  ${ed.mode === "edit" ? `<p class="small muted">Logged by <b data-uid="${esc(ed.owner)}"></b> · ${esc(fmtDT(ed.bill.logged_at))}${ed.bill.updated_at && ed.bill.updated_at !== ed.bill.logged_at ? ` · edited ${esc(fmtDT(ed.bill.updated_at))}` : ""}</p>` : ""}
  <div id="discard-slot"></div>
  <div class="card ed-top">
    <div class="ed-fields">
      <label class="field"><span>Bill No.</span><input class="inp billno" id="ed-billno" value="${esc(ed.billNo)}" placeholder="e.g. 4471" autocomplete="off" ${ro ? "disabled" : ""}></label>
      <label class="field"><span>Bill date</span><input class="inp date" type="date" id="ed-date" value="${esc(ed.date)}" ${ro ? "disabled" : ""}></label>
    </div>
    ${hasPhoto ? `<button class="thumb" data-act="photo" aria-label="View bill photo"><img src="${esc(photoSrc)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'small muted',textContent:'No photo'}))"></button>` : ""}
  </div>
  <div class="card pay-row">
    <span class="field-lbl">Payment status</span>
    <div class="seg" role="group" aria-label="Payment status">
      <button data-act="ed-pay" data-v="unpaid" aria-pressed="${!ed.paid}" ${ro ? "disabled" : ""}>Unpaid</button>
      <button data-act="ed-pay" data-v="paid" aria-pressed="${ed.paid}" ${ro ? "disabled" : ""}>Paid</button>
    </div>
    ${ed.mode === "edit" && isPaid(ed.bill) && ed.bill.paid_at ? `<span class="small muted">Marked paid ${esc(fmtDT(ed.bill.paid_at))} by <span data-uid="${esc(ed.bill.paid_by || "")}"></span></span>` : ""}
  </div>
  ${ed.notice ? `<div class="note ${ed.notice.tone}">${esc(ed.notice.text)}</div>` : ""}
  <div class="note warn" id="mm-note" hidden></div>
  <div class="rows-head" aria-hidden="true"><span>S.No.</span><span>Item name</span><span class="r">Qty.</span><span class="r">Rate</span><span class="r">Tot. Amt.</span><span></span></div>
  <div class="rows" id="rows">${ed.rows.map((r, i) => rowHtml(r, i, ro)).join("")}</div>
  ${ro ? "" : `<button class="btn btn-ghost btn-block" data-act="add-row" style="border-style:dashed">+ Add row</button>`}
  <div id="problems"></div>
  <div class="foot">
    <div class="sum"><span class="small muted" id="ed-count"></span><b class="num" id="ed-total"></b></div>
    ${ro ? "" : `<button class="btn btn-primary" data-act="submit" id="submit">${ed.mode === "new" ? "Submit" : "Save changes"}</button>`}
  </div>
  ${ed.mode === "edit" && ed.canEdit ? `<div id="del-slot"><button class="btn btn-danger btn-block" data-act="del-bill">Delete bill</button></div>` : ""}`;
  updateEditorBits();
  paintNames(main);
}
function rowHtml(r, i, ro) {
  const dis = ro ? "disabled" : "";
  return `<div class="irow" data-key="${r.key}">
    <div class="irow-top">
      <span class="irow-label">Row ${i + 1}</span>
      <label class="sno"><span class="lbl">S.No.</span><input class="inp" inputmode="numeric" data-f="serial_no" value="${esc(r.serial_no)}" aria-label="Serial number, row ${i + 1}" ${dis}></label>
      ${ro ? "" : `<button class="del" data-act="del-row" aria-label="Delete row ${i + 1}">${ICON.trash}</button>`}
    </div>
    <input class="inp name" data-f="item_name" value="${esc(r.item_name)}" placeholder="Item name" aria-label="Item name, row ${i + 1}" ${dis}>
    <div class="nums">
      <label class="field"><span class="lbl">Qty.</span><input class="inp" inputmode="decimal" data-f="qty" value="${esc(r.qty)}" aria-label="Qty, row ${i + 1}" ${dis}></label>
      <label class="field"><span class="lbl">Rate</span><input class="inp" inputmode="decimal" data-f="rate" value="${esc(r.rate)}" aria-label="Rate, row ${i + 1}" ${dis}></label>
      <label class="field"><span class="lbl">Tot. Amt.</span><input class="inp" inputmode="decimal" data-f="total_amount" value="${esc(r.total_amount)}" aria-label="Tot. Amt., row ${i + 1}" ${dis}></label>
    </div>
    <div class="mm-hint" hidden><span></span>${ro ? "" : '<button class="btn-link" data-act="use-calc">Use this</button>'}</div>
  </div>`;
}
function updateEditorBits() {
  const ed = S.editor; if (!ed || ed.phase !== "edit") return;
  let mm = 0;
  for (const r of ed.rows) {
    const el = document.querySelector(`.irow[data-key="${r.key}"]`); if (!el) continue;
    const bad = rowMismatch(r); if (bad) mm++;
    el.classList.toggle("is-mm", bad);
    el.classList.toggle("is-bad", ed.problems.includes(r.key));
    el.querySelector('[data-f="total_amount"]').classList.toggle("is-mm", bad);
    const hint = el.querySelector(".mm-hint"); hint.hidden = !bad;
    if (bad) hint.firstElementChild.innerHTML = `Qty × Rate = <b class="num">${money(parseNum(r.qty) * parseNum(r.rate))}</b>`;
  }
  const note = $("#mm-note"); note.hidden = !mm;
  note.innerHTML = `<b>${mm}</b> row${mm === 1 ? "" : "s"} highlighted: Qty × Rate doesn't match Tot. Amt. Please check.`;
  $("#ed-total").textContent = "₹ " + money(editorTotal(ed));
  $("#ed-count").textContent = `${ed.rows.filter((r) => r.item_name.trim()).length} items · Total`;
}
function refreshEditorReadonlyBits() {}

function validate(ed) {
  const problems = []; const keys = [];
  const rows = ed.rows.filter((r) => r.item_name.trim() || r.qty.trim() || r.rate.trim() || r.total_amount.trim());
  if (!ed.date) problems.push("Enter the bill date.");
  if (!rows.length) problems.push("Add at least one item.");
  const items = rows.map((r, i) => {
    const label = `Row ${ed.rows.indexOf(r) + 1}`;
    if (!r.item_name.trim()) { problems.push(`${label}: item name is required.`); keys.push(r.key); }
    for (const [f, nice] of [["serial_no", "S.No."], ["qty", "Qty"], ["rate", "Rate"], ["total_amount", "Tot. Amt."]]) {
      if (r[f].trim() && parseNum(r[f]) == null) { problems.push(`${label}: ${nice} must be a number.`); keys.push(r.key); }
    }
    const s = parseNum(r.serial_no);
    return { serial_no: s == null ? i + 1 : Math.trunc(s), item_name: r.item_name.trim(), qty: parseNum(r.qty), rate: parseNum(r.rate), total_amount: parseNum(r.total_amount) };
  });
  return { items, problems, keys };
}

async function submit(force) {
  const ed = S.editor; const v = validate(ed);
  ed.problems = v.keys; updateEditorBits();
  const box = $("#problems");
  if (v.problems.length) { showProblems(`<div class="note bad"><b>Please fix:</b><br>${v.problems.map(esc).join("<br>")}</div>`); return; }
  const dup = duplicateOf(ed);
  if (dup && force !== "dup" && force !== true) {
    showProblems(`<div class="note warn confirm"><span>Bill No. <b>${esc(ed.billNo.trim())}</b> is already logged: ${esc(fmtDate(dup.bill_date))}, ₹ ${money(billTotal(dup))}, by <span data-uid="${esc(dup.owner)}"></span>.</span><button class="btn btn-primary" data-act="submit-dup">Save anyway</button><button class="btn btn-ghost" data-act="dismiss">Check again</button></div>`);
    return;
  }
  const mm = ed.rows.filter(rowMismatch).length;
  if (mm && force !== true) {
    showProblems(`<div class="note warn confirm"><span>${mm} row${mm === 1 ? "" : "s"} still ha${mm === 1 ? "s" : "ve"} Qty × Rate different from Tot. Amt.</span><button class="btn btn-primary" data-act="submit-force">Save anyway</button><button class="btn btn-ghost" data-act="dismiss">Check again</button></div>`);
    return;
  }
  box.innerHTML = "";
  const btn = $("#submit"); btn.disabled = true; btn.textContent = "Saving…";
  const db = S.caps.db; const now = new Date().toISOString();
  try {
    let owner, id, before = null, body;
    if (ed.mode === "new") {
      owner = S.uid; id = newId();
      body = { ...payFields(null, ed.paid, now), bill_no: ed.billNo.trim(), bill_date: ed.date, items: v.items, image_id: ed.imageId || null, logged_by: S.uid, logged_at: now, updated_at: now, updated_by: S.uid };
    } else {
      owner = ed.owner; id = ed.id; before = stripBill(ed.bill);
      body = { ...stripBill(ed.bill), ...payFields(ed.bill, ed.paid, now), bill_no: ed.billNo.trim(), bill_date: ed.date, items: v.items, updated_at: now, updated_by: S.uid };
    }
    await db.doc(`bills/${owner}/list/${id}`).set(body);          // bill and all its items in one write
    if (ed.mode === "new") await db.doc(`bills/${owner}`).set({ updated_at: now });
    writeAudit(ed.mode === "new" ? "bill.create" : "bill.update", owner, id, before, body);
    const wasNew = ed.mode === "new";
    S.editor = null;
    flash(wasNew ? "Bill saved." : "Changes saved.");
    renderTabs(); render();
  } catch (e) {
    btn.disabled = false; btn.textContent = ed.mode === "new" ? "Submit" : "Save changes";
    box.innerHTML = `<div class="note bad">${esc(dbErrorText(e))}</div>`;
  }
}
function payFields(prev, paid, now) {
  if (paid) return prev && isPaid(prev) ? { payment_status: "paid", paid_at: prev.paid_at || now, paid_by: prev.paid_by || S.uid } : { payment_status: "paid", paid_at: now, paid_by: S.uid };
  return { payment_status: "unpaid", paid_at: null, paid_by: null };
}
function canChange(b) { return S.isAdmin || (b.owner === S.uid && S.canWrite); }
/** Quick Paid / Unpaid toggle from the Bills list. */
async function markPaid(owner, id, paid, btn) {
  const b = (S.bills.get(owner) || []).find((x) => x.id === id); if (!b || !canChange(b)) return;
  btn.disabled = true; btn.textContent = "Saving…";
  const now = new Date().toISOString(); const fields = payFields(b, paid, now);
  try {
    await S.caps.db.doc(`bills/${owner}/list/${id}`).update({ ...fields, updated_at: now, updated_by: S.uid });
    writeAudit(paid ? "bill.paid" : "bill.unpaid", owner, id, { ...stripBill(b) }, { ...stripBill(b), ...fields });
    flash(paid ? `Bill${b.bill_no ? " No. " + b.bill_no : ""} marked paid.` : "Bill marked unpaid."); render();
  } catch (e) { btn.disabled = false; btn.textContent = paid ? "Paid" : "Mark unpaid"; flash(dbErrorText(e)); render(); }
}
function normNo(v) { return String(v || "").trim().toLowerCase().replace(/\s+/g, ""); }
function duplicateOf(ed) {
  const no = normNo(ed.billNo); if (!no) return null;
  return allBills().find((b) => normNo(b.bill_no) === no && !(ed.mode === "edit" && b.owner === ed.owner && b.id === ed.id)) || null;
}
function showProblems(html) { const box = $("#problems"); box.innerHTML = html; if (html) box.scrollIntoView({ block: "end", behavior: "smooth" }); paintNames(box); }
function stripBill(b) { const { id, owner, ...rest } = b; return rest; }
function dbErrorText(e) {
  switch (e?.code) {
    case "invalid_argument": return "You don't have permission to save this bill.";
    case "quota_exceeded": return "The bill log is full. An admin needs to delete old bills before new ones can be saved.";
    case "resource_exhausted": return "Too many saves at once. Wait a moment and try again.";
    case "revoked": return "Your access to this page changed. Reload to continue.";
    default: return "The bill couldn't be saved. Check your connection and try again.";
  }
}
async function writeAudit(action, owner, id, before, after) {
  try {
    const db = S.caps.db; const at = new Date().toISOString();
    await db.collection(`audit/${S.uid}/log`).add({ action, actor: S.uid, owner, bill: id, at, before, after });
    await db.doc(`audit/${S.uid}`).set({ updated_at: at });
  } catch {}
}
async function deleteBill() {
  const ed = S.editor; const slot = $("#del-slot");
  slot.querySelector("button").disabled = true;
  try {
    await S.caps.db.doc(`bills/${ed.owner}/list/${ed.id}`).delete();
    writeAudit("bill.delete", ed.owner, ed.id, stripBill(ed.bill), null);
    if (ed.imageId && S.caps.assets) S.caps.assets.delete(ed.imageId).catch(() => {});
    S.editor = null; flash("Bill deleted."); renderTabs(); render();
  } catch (e) { slot.innerHTML = `<div class="note bad">${esc(dbErrorText(e))}</div>`; }
}
let flashMsg = null;
function flash(t) { flashMsg = t; setTimeout(() => { flashMsg = null; const f = $("#flash"); f && f.remove(); }, 4000); }
const _render = render;
render = function () { _render(); if (flashMsg && !S.editor) $("#main").insertAdjacentHTML("afterbegin", `<div class="note ok" id="flash">${esc(flashMsg)}</div>`); };

function askDiscard(onYes) {
  const slot = $("#discard-slot"); if (!slot) { onYes(); return; }
  slot.innerHTML = `<div class="note warn confirm"><span>Discard this bill? Your changes will be lost.</span><button class="btn btn-danger" data-act="discard-yes">Discard</button><button class="btn btn-ghost" data-act="dismiss">Keep editing</button></div>`;
  slot._onYes = onYes; slot.scrollIntoView({ block: "center" });
}

/* ---------------- photo viewer (pinch to zoom) ---------------- */
function openViewer(src) {
  const v = document.createElement("div"); v.className = "viewer"; v.setAttribute("role", "dialog"); v.setAttribute("aria-label", "Bill photo");
  v.innerHTML = `<div class="viewer-bar"><span class="small">Pinch or double-tap to zoom</span><button data-x>Close</button></div><div class="stage"><img alt="Bill photo"></div>`;
  const img = v.querySelector("img"); img.src = src; document.body.append(v); document.body.style.overflow = "hidden";
  let s = 1, tx = 0, ty = 0; const pts = new Map(); let last = null, lastTap = 0;
  const apply = () => { img.style.transform = `translate(${tx}px,${ty}px) scale(${s})`; };
  const stage = v.querySelector(".stage");
  const local = (e) => { const r = img.getBoundingClientRect(); return { x: e.clientX - r.left + 0, y: e.clientY - r.top + 0 }; };
  const zoomAt = (cx, cy, ns) => { ns = Math.min(6, Math.max(1, ns)); const r = stage.getBoundingClientRect(); const ox = cx - r.left, oy = cy - r.top; const base = img.offsetLeft, baseT = img.offsetTop; const px = (ox - base - tx) / s, py = (oy - baseT - ty) / s; s = ns; tx = ox - base - px * s; ty = oy - baseT - py * s; if (s === 1) { tx = 0; ty = 0; } apply(); };
  stage.addEventListener("pointerdown", (e) => { stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, e); if (pts.size === 1) { const now = Date.now(); if (now - lastTap < 300) zoomAt(e.clientX, e.clientY, s > 1 ? 1 : 2.5); lastTap = now; } last = null; });
  stage.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return; const prev = pts.get(e.pointerId); pts.set(e.pointerId, e);
    if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); const cx = (a.clientX + b.clientX) / 2, cy = (a.clientY + b.clientY) / 2; if (last) zoomAt(cx, cy, s * d / last); last = d; }
    else if (s > 1) { tx += e.clientX - prev.clientX; ty += e.clientY - prev.clientY; apply(); }
  });
  const up = (e) => { pts.delete(e.pointerId); last = null; };
  stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
  stage.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, s * (e.deltaY < 0 ? 1.15 : 0.87)); }, { passive: false });
  const close = () => { v.remove(); document.body.style.overflow = ""; document.removeEventListener("keydown", key); };
  const key = (e) => e.key === "Escape" && close();
  document.addEventListener("keydown", key);
  v.querySelector("[data-x]").onclick = close;
  v.querySelector("[data-x]").focus();
}

/* ---------------- events ---------------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act; const ed = S.editor;
  switch (act) {
    case "scan-menu": S.scanMenu = !S.scanMenu; render(); if (S.scanMenu) $("#scan-sheet .sheet-opt")?.focus(); break;
    case "camera": S.scanMenu = false; $("#camera").click(); break;
    case "gallery": S.scanMenu = false; $("#gallery").click(); break;
    case "manual": openNew(null); break;
    case "open": openBill(t.dataset.owner, t.dataset.id); break;
    case "scope": S.filters.scope = t.dataset.v; render(); break;
    case "sum-pay": S.summary.pay = t.dataset.v; render(); break;
    case "sort": { const k = t.dataset.k; S.summary.dir = S.summary.sort === k ? -S.summary.dir : (k === "item_name" || k === "logged_by" ? 1 : -1); S.summary.sort = k; render(); break; }
    case "rep-field": rep().field = t.dataset.v; rep().rows = null; render(); break;
    case "rep-preview": runReport(); render(); break;
    case "rep-format": rep().format = t.dataset.v; rep().msg = null; render(); break;
    case "rep-save": saveReport(); break;
    case "audit-load": loadAudit(); break;
    case "ed-back": if (ed?.dirty) askDiscard(discardAndClose); else closeEditor(); break;
    case "discard-yes": { const slot = $("#discard-slot"); const fn = slot?._onYes; fn ? fn() : discardAndClose(); break; }
    case "dismiss": t.closest(".note").remove(); break;
    case "photo": openViewer(ed.previewUrl || "/_blob/" + ed.imageId); break;
    case "add-row": {
      const max = ed.rows.reduce((m, r) => Math.max(m, parseNum(r.serial_no) || 0), 0);
      ed.rows.push(emptyRow(max + 1)); ed.dirty = true;
      const rows = $("#rows"); rows.insertAdjacentHTML("beforeend", rowHtml(ed.rows.at(-1), ed.rows.length - 1, false));
      updateEditorBits(); rows.lastElementChild.querySelector('[data-f="item_name"]').focus(); break;
    }
    case "del-row": {
      const key = t.closest(".irow").dataset.key; ed.rows = ed.rows.filter((r) => r.key !== key); if (!ed.rows.length) ed.rows.push(emptyRow(1));
      ed.dirty = true; $("#rows").innerHTML = ed.rows.map((r, i) => rowHtml(r, i, false)).join(""); updateEditorBits(); break;
    }
    case "use-calc": {
      const key = t.closest(".irow").dataset.key; const r = ed.rows.find((x) => x.key === key);
      r.total_amount = String(round2(parseNum(r.qty) * parseNum(r.rate))); ed.dirty = true;
      t.closest(".irow").querySelector('[data-f="total_amount"]').value = r.total_amount; updateEditorBits(); break;
    }
    case "submit": submit(false); break;
    case "submit-force": submit(true); break;
    case "submit-dup": submit("dup"); break;
    case "ed-pay": ed.paid = t.dataset.v === "paid"; ed.dirty = true; t.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === t))); break;
    case "mark-paid": markPaid(t.dataset.owner, t.dataset.id, t.dataset.v === "paid", t); break;
    case "del-bill": {
      const slot = $("#del-slot");
      slot.innerHTML = `<div class="note bad confirm"><span>Delete this bill and all its items? This can't be undone.</span><button class="btn btn-danger" data-act="del-yes">Delete</button><button class="btn btn-ghost" data-act="del-no">Keep</button></div>`; slot.scrollIntoView({ block: "end", behavior: "smooth" }); break;
    }
    case "del-yes": deleteBill(); break;
    case "del-no": $("#del-slot").innerHTML = `<button class="btn btn-danger btn-block" data-act="del-bill">Delete bill</button>`; break;
  }
});
async function discardAndClose() {
  const ed = S.editor;
  if (ed?.mode === "new" && ed.imageId && S.caps.assets) S.caps.assets.delete(ed.imageId).catch(() => {});
  closeEditor();
}
document.addEventListener("input", (e) => {
  const t = e.target; const ed = S.editor;
  if (ed && t.dataset.f) { const key = t.closest(".irow").dataset.key; const r = ed.rows.find((x) => x.key === key); r[t.dataset.f] = t.value; ed.dirty = true; updateEditorBits(); return; }
  if (ed && t.id === "ed-date") { ed.date = t.value; ed.dirty = true; return; }
  if (ed && t.id === "ed-billno") { ed.billNo = t.value; ed.dirty = true; return; }
  const act = t.dataset.act;
  if (act === "sum-q") { S.summary.q = t.value; clearTimeout(t._d); t._d = setTimeout(() => { const pos = t.selectionStart; render(); const n = $("#sum-q"); n.focus(); n.setSelectionRange(pos, pos); }, 250); }
  if (act === "rep-item") { rep().item = t.value; rep().rows = null; }
  if (act === "bf-q") { S.filters.q = t.value; clearTimeout(t._d); t._d = setTimeout(() => { const pos = t.selectionStart; render(); const n = $("#bf-q"); n.focus(); n.setSelectionRange(pos, pos); }, 250); }
});
document.addEventListener("change", (e) => {
  const t = e.target; const act = t.dataset.act;
  if (t.id === "camera" || t.id === "gallery") { const f = t.files?.[0]; t.value = ""; S.scanMenu = false; if (f) openNew(f); return; }
  if (act === "bf-date") { S.filters.from = $("#bf-from").value; S.filters.to = $("#bf-to").value; render(); }
  if (act === "sf-date") { S.summary.from = $("#sf-from").value; S.summary.to = $("#sf-to").value; render(); }
  if (act === "rf-date") { rep().from = $("#rf-from").value; rep().to = $("#rf-to").value; rep().rows = null; render(); }
  if (act === "rep-item") render();
  if (act === "rep-col") {
    const r = rep(); t.checked ? r.cols.add(t.value) : r.cols.delete(t.value); r.msg = null;
    try { localStorage.setItem("pbl-cols", JSON.stringify([...r.cols])); } catch {}
    render();
  }
});

boot();
</script>
